name: Audit beta0.4 r4 identity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify final r4 identity without modifying the branch
        run: |
          python scripts/validate-beta04-structure.py
          python scripts/test-beta04-math.py
          python - <<'PY'
          from pathlib import Path
          files = {
              'source': Path('src/nr_before_sr.cpp').read_text(encoding='utf-8'),
              'resource': Path('src/nr_before_sr.rc').read_text(encoding='utf-8'),
              'build': Path('scripts/build.ps1').read_text(encoding='utf-8'),
              'config': Path('config/nr_before_sr.ini').read_text(encoding='utf-8'),
          }
          required = (
              ('source', 'kAddonVersion = "beta0.4-perfect-chain-r4"'),
              ('source', 'kBuildIdentity = "beta0.4-perfect-chain-r4"'),
              ('resource', 'FILEVERSION 0,4,0,4'),
              ('resource', 'PRODUCTVERSION 0,4,0,4'),
              ('build', 'beta0.4-perfect-chain-r4'),
              ('config', 'beta0.4 perfect-chain r4'),
          )
          missing = [f'{name}:{marker}' for name, marker in required if marker not in files[name]]
          if missing:
              raise SystemExit('missing r4 identity markers: ' + ', '.join(missing))
          print('beta0.4 r4 identity markers passed')
          PY
          git diff --check
