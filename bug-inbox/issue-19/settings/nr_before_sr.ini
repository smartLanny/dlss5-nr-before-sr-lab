[NRBeforeSR]
; beta0.3.3-dev: F6 toggles Enabled. Mode 2 (NR -> SR) is the safe default.
; Main keyboard '-' (or numpad subtract) saves a ReShade screenshot whose file name includes the live settings.
; Mode 1 is SR -> output-resolution NR for full-resolution quality comparison.
; It activates automatically when the live output/color contract is verified.
; Render resolution always follows the game's DLSS quality setting.
; NR Detail Blend is shared by both chains and is not a scaling ratio.
; ColorStrength=0 keeps the game's hue while retaining NR luminance detail.
