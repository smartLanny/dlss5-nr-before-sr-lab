<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' file: data:; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DLSS 5 AI 超分管理器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">5</div>
        <div><h1 id="brandName">DLSS 5 AI 超分</h1><p id="brandEdition">装机宅版</p></div>
      </div>
      <nav>
        <button class="nav active" data-view="games"><span>▣</span>游戏</button>
        <button class="nav" data-view="repair"><span>◇</span>修复</button>
        <button class="nav" data-view="settings"><span>⚙</span>设置</button>
      </nav>
      <div class="sidebar-foot">
        <p id="authorText">by 野生的装机宅</p>
        <button class="text-link" id="bilibiliBtn">Bilibili 主页 ↗</button>
        <button class="text-link hidden" id="qqBtn">加入交流群</button>
        <button class="text-link hidden" id="updateBtn">更新与公告 ↗</button>
        <small id="versionText"></small>
      </div>
    </aside>

    <main>
      <header class="titlebar">
        <div class="page-title"><h2 id="pageTitle">我的游戏</h2><p id="pageSubtitle">只显示真实检测结果，不做运行状态猜测</p></div>
        <div class="title-actions">
          <button class="button subtle" id="addGameBtn">＋ 添加游戏</button>
          <button class="button" id="refreshBtn">重新扫描</button>
          <button class="window-button" id="minBtn" aria-label="最小化">—</button>
          <button class="window-button close" id="closeBtn" aria-label="关闭">×</button>
        </div>
      </header>

      <section class="view active" id="view-games">
        <div class="notice hidden" id="payloadNotice"></div>
        <div class="toolbar-row">
          <div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索游戏" autocomplete="off"></div>
          <div class="summary" id="gameSummary"></div>
        </div>
        <div class="game-list" id="gameList"></div>
        <div class="empty hidden" id="emptyState">
          <h3>还没有找到游戏</h3>
          <p>先自动扫描 Steam、Epic、GOG；也可以手动选择游戏目录。</p>
          <button class="button primary" id="emptyAddBtn">添加游戏</button>
        </div>
      </section>

      <section class="view" id="view-repair">
        <div class="panel repair-head">
          <div><h3>安装检查与修复</h3><p>只检查文件是否完整；不会声称游戏内 AI 已经成功运行。</p></div>
          <select id="repairGameSelect"></select>
        </div>
        <div class="panel diagnostics" id="diagnostics"></div>
        <div class="repair-actions">
          <button class="button primary" id="repairBtn">一键修复</button>
          <button class="button" id="copyDiagBtn">复制诊断信息</button>
          <button class="button danger" id="uninstallBtn">卸载插件</button>
        </div>
      </section>

      <section class="view" id="view-settings">
        <div class="panel settings-panel">
          <h3>扫描范围</h3>
          <label class="setting-row">
            <div><strong>扫描本机其他游戏目录</strong><p>默认关闭，开启后会寻找常见 Games / Repacks 等目录。</p></div>
            <input type="checkbox" id="scanDrivesToggle">
          </label>
          <div class="setting-row">
            <div><strong>手动添加游戏库</strong><p>选择一个包含多个游戏的上级目录。</p></div>
            <button class="button" id="addFolderBtn">添加目录</button>
          </div>
        </div>
        <div class="panel settings-panel">
          <h3>产品信息</h3>
          <div class="info-row"><span>版本</span><b id="settingsVersion"></b></div>
          <div class="info-row"><span>作者</span><b id="settingsAuthor">野生的装机宅</b></div>
          <div class="info-row"><span>上游基础</span><b>DLSS5-Swapper (MIT)</b></div>
          <div class="info-row"><span>游戏内设置</span><b>继续使用 ReShade Overlay</b></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal hidden" id="modal">
    <div class="modal-card">
      <h3 id="modalTitle"></h3>
      <p id="modalBody"></p>
      <label class="check-line hidden" id="removeSettingsLine"><input type="checkbox" id="removeSettingsCheck"> 同时删除个人参数设置</label>
      <div class="modal-actions"><button class="button" id="modalCancel">取消</button><button class="button danger" id="modalConfirm">确认</button></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
