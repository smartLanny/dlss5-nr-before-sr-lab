[NRBeforeSR]
; beta0.3.8-hd2-exp1: experimental Feature 11 observer; compatibility unverified.
; F6 toggles Enabled. Mode 2 (NR -> SR) is the safe default.
; F8 collects a local feedback ZIP with three current-setting screenshots, NR stages and logs; no automatic A/B.
; Main keyboard '-' (or numpad subtract) saves a ReShade screenshot whose file name includes the requested settings.
; Mode 1 is SR -> output-resolution NR for full-resolution quality comparison.
; It activates automatically when the live output/color contract is verified.
; Render resolution always follows the game's DLSS quality setting.
; Final effect strength is shared by both chains. Values 0..1 retain the old
; response; new installations default to 1.2 and 2 is the request limit.
; ColorStrength=0 keeps a luminance-only neural transfer. In verified post-SR
; FP16/unity-exposure contracts, values up to 1 follow bounded NR chroma too.
; Unknown HDR NR->SR contracts remain luminance-only regardless of this value.
ConfigVersion=3
StrengthConfigVersion=1
Enabled=1
Mode=2
IdentityUseOriginalColor=0
TransferStrength=1.20
PostTransferStrength=1.20
ColorStrength=0.75
MaxLumaRatio=2.00
PreserveLighting=0
ProxyScale=1.0
; Default-off HDR proxy experiment. Switching rebuilds NR history; SDR encoding is unchanged.
ExperimentalPeakShoulder=0
; UI exposes the reciprocal as Scene Paper-White Scale (default 1.0).
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=1.0
LocalToneStrength=1.0
LocalStructureStrength=1.0
SkinStructureStrength=-1.0
AutoMask=0
Style=0
; Model hint for games that supply a separate UI layer. It cannot isolate HUD
; pixels already baked into SceneColor. Existing explicit 0/1 values are kept.
UICorrection=1
; FH6 stability default: do not inject NR into a Reset(NULL)/ClearState(NULL)
; carrier. Set to 1 only for a controlled compatibility experiment, then fully
; restart the game. This publishes a much wider D3D12 state-observer surface.
ExperimentalNullPsoCarrier=0
PerfEpoch=0
; Profile-owned contract: 0 unknown/safe bypass, 1 linear UNORM, 2 sRGB values in UNORM.
R8OutputEncoding=0
; Developer option: 0 preserves legacy behaviour; 1 forwards finite game
; pixel jitter to NR after source->work grid conversion. Missing/invalid input
; is unknown, never a synthetic zero. Switching rebuilds NR history.
JitterMode=0
