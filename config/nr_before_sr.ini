[NRBeforeSR]
; 0.4 maintenance defaults. Existing explicit user settings are retained. F6 toggles Enabled.
; Mode 2 is the optimized NR working-raster -> matched residual -> native game SR path.
ConfigVersion=4
StrengthConfigVersion=1
Enabled=1
Mode=2
IdentityUseOriginalColor=0
; Final blend range 0..4: 0 native bypass, 1 normal, 2 doubled, 4 maximum (not recommended).
; Existing values above 4 are clamped on load. Model Intensity remains a separate 0..2 control.
TransferStrength=1.20
PostTransferStrength=1.20
; 0 Reference, 1 Quality, 2 Balanced, 3 Performance, 4 Ultra, 5 Custom.
WorkMode=1
CustomWorkScale=0.75
; 0 preserves model drift, 1 attenuates its broad local luminance component.
; Protection never reverses the pixel's existing edit into a dark/bright halo.
LightingLock=0.20
; Reduces the edit on high-contrast geometry, hair and UI-like edges.
EdgeGuard=0.25
; Experimental: filter only inconsistent fine residuals. Default off.
DetailStability=0.00
; No verified per-pixel depth/history input yet; request is reported unavailable.
MotionStability=0
; 0 legacy shoulder, 1 hybrid recommended, 2 reversible/aggressive.
ProxyCurve=1
AllowUnverifiedHdrColor=0
SuppressResetFrame=1
; 0 luminance only, 1 follows model colour, 2 exaggerates chroma.
ColorStrength=1.0
; Hard powered-ratio ceiling; keep 4 for normal testing.
MaxLumaRatio=4.00
; Legacy Mode-1 compatibility only. V2 uses LightingLock above.
PreserveLighting=0
ProxyScale=1.0
; Default-off HDR proxy experiment. Switching rebuilds NR history; SDR encoding is unchanged.
ExperimentalPeakShoulder=0
; UI exposes the reciprocal as Scene Paper-White Scale (default 1.0).
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=1.0
LocalToneStrength=1.0
LocalStructureStrength=1.0
; Saved independent skin preference. With AutoMask=0 the model always receives
; -1 (follow LocalStructureStrength), without discarding this saved value.
; With AutoMask=1 legacy negative values become 0; the visible range is 0..2.
SkinStructureStrength=-1.0
; Model face-mask request; not a plugin-generated face-detection map.
AutoMask=0
Style=0
; Model hint for games that supply a separate UI layer. It cannot isolate HUD
; pixels already baked into SceneColor. Existing explicit 0/1 values are kept.
UICorrection=1
; FH6 stability default: do not inject NR into a Reset(NULL)/ClearState(NULL)
; carrier. Set to 1 only for a controlled compatibility experiment, then fully
; restart the game. This publishes a much wider D3D12 state-observer surface.
ExperimentalNullPsoCarrier=0
PerfEpoch=0
; Profile-owned contract: 0 unknown/safe bypass, 1 linear UNORM, 2 sRGB values in UNORM.
R8OutputEncoding=0
; Developer option: 0 preserves legacy behaviour; 1 forwards finite game
; pixel jitter to NR after source->work grid conversion. Missing/invalid input
; is unknown, never a synthetic zero. Switching rebuilds NR history.
JitterMode=1
; F8: one date/game/build-named TXT (2 MiB ceiling), no GPU capture or settings changes.
; F7: visual supplement, automatically generates a new paired core first.
; F6/F7 cannot be used as custom core-feedback shortcuts.
FeedbackVirtualKey=119
