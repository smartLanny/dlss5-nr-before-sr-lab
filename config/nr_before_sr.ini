[NRBeforeSR]
; beta0.4 perfect-chain r2 experiment. F6 toggles Enabled.
; Mode 2 is the optimized NR working-raster -> matched residual -> native game SR path.
ConfigVersion=4
Enabled=1
Mode=2
IdentityUseOriginalColor=0
; Multiplicative strength: 1 normal, 2 doubled, 4 strong, 8 extreme/diagnostic.
TransferStrength=1.00
PostTransferStrength=1.00
; 0 Reference, 1 Quality, 2 Balanced, 3 Performance, 4 Ultra, 5 Custom.
WorkMode=1
CustomWorkScale=0.75
; 0 preserves model drift, 1 removes the broad local luminance component.
LightingLock=0.20
; Reduces the edit on high-contrast geometry, hair and UI-like edges.
EdgeGuard=0.25
; 0 legacy shoulder, 1 hybrid recommended, 2 reversible/aggressive.
ProxyCurve=1
AllowUnverifiedHdrColor=0
SuppressResetFrame=1
; 0 luminance only, 1 follows model colour, 2 exaggerates chroma.
ColorStrength=0.00
; Hard powered-ratio ceiling; keep 4 for normal testing.
MaxLumaRatio=4.00
; Legacy Mode-1 compatibility only. V2 uses LightingLock above.
PreserveLighting=0
ProxyScale=1.0
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=1.0
LocalToneStrength=1.0
LocalStructureStrength=1.0
SkinStructureStrength=-1.0
AutoMask=0
Style=0
UICorrection=0
PerfEpoch=0
; Profile-owned contract: 0 unknown/safe bypass, 1 linear UNORM, 2 sRGB values in UNORM.
R8OutputEncoding=0
