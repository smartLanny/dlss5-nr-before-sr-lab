[NRBeforeSR]
; beta0.5-dline10 full-input replay diagnostics. Picture defaults retain D8 behavior. F6 toggles Enabled.
; Single NR only; game quality and median/P95 GPU cost <= 5% are not yet verified.
; Mode 2 is the optimized NR working-raster -> matched residual -> native game SR path.
ConfigVersion=4
StrengthConfigVersion=1
ExtraStrengthPolicyVersion=1
JitterPolicyVersion=1
Enabled=1
Mode=2
IdentityUseOriginalColor=0
; User extra enhancement range 1..4: 1 normal, 2 doubled, 4 maximum.
; One-time upgrade raises legacy 0<T<1 to 1; legacy T=0 becomes T=1 with Enabled=0.
; Model Intensity stays separate. Internal diagnostics retain the 0..4 range.
TransferStrength=1.00
PostTransferStrength=1.00
; 0 Reference, 1 Quality, 2 Balanced, 3 Performance, 4 Ultra, 5 Custom.
; New install: exact N=R. Existing explicit presets/custom settings are kept.
WorkMode=0
; 0 ExactArea (default), 1 scale-aware Lanczos2 AA input; Mode2 only.
; Input kernel changes reset its history; 1:1 and preparation failure keep Area.
NRInputFilter=0
CustomWorkScale=1.00
; Custom accepts 0.5..1; unsupported requests retain the previous valid pair.
; CustomWorkScale=0 with WorkMode=5 disables NR and retains the last precision.
; 0 preserves model drift, 1 attenuates its broad local luminance component.
; Protection never reverses the pixel's existing edit into a dark/bright halo.
LightingLock=0.20
; Reduces the edit on high-contrast geometry, hair and UI-like edges.
EdgeGuard=0.25
; Experimental: filter only inconsistent fine residuals. Default off.
DetailStability=0.00
; Mode 2 only: soft-limit extra (>1x) edit; 0 restores beta0.4 amplification.
HighStrengthProtection=1
; Above 1x additional enhancement, limit extra colour amplification. Default on.
; 0 disables this budget only; finite/HDR/gamut protections remain active.
ColorProtection=1
; One-inference Mode2 composition, not cascaded NR. Off/neutral preserves the old path.
LayeredEnhancement=0
; 0.5 opt-in pre/post candidate: nonzero master controls luma, ColorStrength controls chroma.
; Master zero still bypasses all edits. Off restores the two legacy route references.
IndependentChromaComposition=0
; #11: optional N-sized luma log field. Effective only Mode2 + ColorStrength=0.
; No extra NR; source-edge/HDR/final protection stays at full resolution.
LowGridEditField=0
; Optional #85 recovery kernel. 0=BilinearSafe; requires luma field / colour zero.
CatmullRomEditRestore=0
; #86: optional RGBA field with log luma, normalized opponent colour and validity.
; Default off preserves the RG32F luma field and existing composition paths.
LowGridColorEditField=0
; Each gain is 0..2; combined luminance exponent is capped at 4, not multiplied without limit.
LayerTone=1.00
LayerStructure=1.00
LayerBright=1.00
LayerShadow=1.00
; Composition-only light group. Pre/post supported when the NR route actually executes.
; 1.0 = 100% candidate contribution. This is not material/face segmentation.
; 0 old fine-region controls, 1 complete bright/dark edit with broad/glow modifiers.
; This template selects 1; any INI without the key preserves mode 0.
LightControlMode=1
LightBroad=1.00
LightDark=1.00
LightReflection=1.00
LightStructure=1.00
; 0..1 suppresses added broad brightening; neutral is 0.
LightGlow=0.00
; 0 original mood, 1 natural boost, 2 less glow, 3 custom. Versioned resolved snapshot.
LightStyleVersion=1
LightPreset=0
LightPresetColor=1.00
; Diagnostic preview 0/1/2 is process-only and deliberately has no INI key.
; No verified per-pixel depth/history input yet; request is reported unavailable.
MotionStability=0
; 0 legacy shoulder, 1 hybrid recommended, 2 reversible/aggressive.
ProxyCurve=1
AllowUnverifiedHdrColor=0
SuppressResetFrame=1
; 0 luminance only, 1 follows model colour, 2 exaggerates chroma.
ColorStrength=1.0
; Hard powered-ratio ceiling; keep 4 for normal testing.
MaxLumaRatio=4.00
; Legacy Mode-1 compatibility only. V2 uses LightingLock above.
PreserveLighting=0
ProxyScale=1.0
; Default-off HDR proxy experiment. Switching rebuilds NR history; SDR encoding is unchanged.
ExperimentalPeakShoulder=0
; UI exposes the reciprocal as Scene Paper-White Scale (default 1.0).
WarmupAfterCreate=2
RetryOriginalOnSRFailure=1
DepthMode=-1
Intensity=1.2
LocalToneStrength=1.0
LocalStructureStrength=1.0
; Saved independent skin preference. With AutoMask=0 the model always receives
; -1 (follow LocalStructureStrength), without discarding this saved value.
; With AutoMask=1 legacy negative values become 0; the visible range is 0..2.
SkinStructureStrength=-1.0
; Model face-mask request; not a plugin-generated face-detection map.
AutoMask=0
Style=0
; Model hint for games that supply a separate UI layer. It cannot isolate HUD
; pixels already baked into SceneColor. Existing explicit 0/1 values are kept.
UICorrection=1
; General null-PSO replay stays off. Only fully observed, untainted pristine or
; bounded viewport/scissor/blend subsets are automatically admitted. Unknown
; state stays native; do not enable broad replay to make an A/B test look active.
ExperimentalNullPsoCarrier=0
PerfEpoch=0
; Profile-owned contract: 0 unknown/safe bypass, 1 linear UNORM, 2 sRGB values in UNORM.
R8OutputEncoding=0
; Developer option: 0 preserves legacy behaviour; 1 forwards finite game
; pixel jitter to NR after source->work grid conversion. Missing/invalid input
; is unknown, never a synthetic zero. Switching rebuilds NR history.
; Policy version 1 migrates older preferences to 0 once; later explicit 1 is retained.
JitterMode=0
; F8: one date/game/build-named TXT (2 MiB ceiling), no GPU capture or settings changes.
; F7: visual supplement, automatically generates a new paired core first.
; F6/F7 cannot be used as custom core-feedback shortcuts.
FeedbackVirtualKey=119

; D10 optional region composition. Replaces old five light gains when enabled.
; Four broad/fine bright/dark luma+colour pairs, reflection pair, colour-only.
RegionCompositionVersion=1
RegionComposition=0
RegionGain0=1.0
RegionGain1=1.0
RegionGain2=1.0
RegionGain3=1.0
RegionGain4=1.0
RegionGain5=1.0
RegionGain6=1.0
RegionGain7=1.0
RegionGain8=1.0
RegionGain9=1.0
RegionGain10=1.0
; Optional independent detector: default off; native model controls unchanged.
FaceProtectionVersion=1
FaceProtection=0
FaceExtraCap=1
FaceOriginalLuma=0.0
FaceOriginalColor=0.0

; Optional second inference and model-domain generic residual comparison.
; NR2 is off by default. A new install, missing key, reset, or invalid ratio
; falls back to exact 50%; an existing legal saved ratio is preserved.
NRPasses=1
NRSecondScaleNumerator=1
NRSecondScaleDenominator=2
GenericResidualExperiment=0
