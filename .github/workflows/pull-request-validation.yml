name: Mainline validation (Windows gates primary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_build:
        description: Run the canonical build on the self-hosted runner
        type: boolean
        default: false

# ENABLE_HOSTED_CI is intentionally unset/false while billing is unavailable.
# ENABLE_SELF_HOSTED_CI enables the maintainer's runner (labels below); its
# canonical build runs only on manual dispatch or a PR labelled full-build.
# Skipped jobs are not verification. Full Windows validation is recorded per SHA.
permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-portable:
    # Public contributions run only on an ephemeral hosted Linux runner. This
    # does not enable the separately gated Windows/canonical workflow families.
    if: github.event.repository.private == false && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Portable source and CPU checks
        env:
          CXX: g++
        run: python3 scripts/run-portable-tests.py --verbose

  maintenance:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/beta042-validate.yml

  feedback:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/feedback-integrity.yml

  baseline-and-release-contracts:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/followup-validate.yml

  compatibility:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/compat-continuation.yml

  exposure:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/exposure-access.yml

  single-text:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/f8-single-text-validate.yml

  multi-api:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/multi-api-foundation.yml

  generated-picture:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/multi-api-picture-regression.yml

  picture-controls:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/picture-ui-budget-validate.yml

  recommended-picture:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/recommended-picture-validate.yml

  retirement-ownership:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/retirement-return-validate.yml

  strength-cap:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/strength-cap-validate.yml

  research-050:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/beta050-validate.yml

  d21-uniform-chain:
    if: vars.ENABLE_HOSTED_CI == 'true' && (github.base_ref == 'main' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/d21-uniform-validate.yml

  self-hosted-tests:
    if: >-
      vars.ENABLE_SELF_HOSTED_CI == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.author_association == 'OWNER' &&
        github.actor == github.repository_owner && github.event.action != 'labeled'))
    runs-on: [self-hosted, Windows, X64, dlss5-build]
    timeout-minutes: 30
    steps:
      - name: Locate git and python
        # The runner service may not inherit the interactive PATH. Without git on
        # PATH actions/checkout downloads an archive with no .git directory, and
        # the canonical build refuses to run without a commit identity.
        shell: powershell
        env:
          VAR_DLSS5_GIT_DIR: ${{ vars.DLSS5_GIT_DIR }}
          VAR_DLSS5_PYTHON_DIR: ${{ vars.DLSS5_PYTHON_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-ToolDir([string]$Exe, [string[]]$Dirs) {
            if (Get-Command $Exe -ErrorAction SilentlyContinue) { return }
            $found = $Dirs | Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ $Exe)) } | Select-Object -First 1
            if (-not $found) { throw "$Exe not found on PATH or in: $($Dirs -join '; '). Set the DLSS5_GIT_DIR / DLSS5_PYTHON_DIR repository variable." }
            Write-Host "Adding $found to PATH for $Exe"
            [IO.File]::AppendAllText($env:GITHUB_PATH, "$found`n")
          }
          Add-ToolDir 'git.exe' @($env:VAR_DLSS5_GIT_DIR, $env:DLSS5_GIT_DIR, "$env:ProgramFiles\Git\cmd", "${env:ProgramFiles(x86)}\Git\cmd", "$env:LOCALAPPDATA\Programs\Git\cmd")
          $pythonDirs = @($env:VAR_DLSS5_PYTHON_DIR, $env:DLSS5_PYTHON_DIR) + @(Get-ChildItem -Directory -Path "$env:LOCALAPPDATA\Programs\Python\Python3*", "$env:ProgramFiles\Python3*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object FullName)
          Add-ToolDir 'python.exe' $pythonDirs
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Portable tests
        shell: powershell
        env:
          VAR_DLSS5_TOOLCHAIN_ROOT: ${{ vars.DLSS5_TOOLCHAIN_ROOT }}
        run: |
          $toolchain = if ($env:VAR_DLSS5_TOOLCHAIN_ROOT) { $env:VAR_DLSS5_TOOLCHAIN_ROOT } else { $env:DLSS5_TOOLCHAIN_ROOT }
          if ($toolchain) {
            # Windows-only tests locate the pinned LLVM-MinGW through these names.
            if (-not $env:CXX) { $env:CXX = Join-Path $toolchain 'bin/x86_64-w64-mingw32-clang++.exe' }
            if (-not $env:DLSS5_LLVM_MINGW_ROOT) { $env:DLSS5_LLVM_MINGW_ROOT = $toolchain }
            if (-not $env:NR_LLVM_BIN) { $env:NR_LLVM_BIN = Join-Path $toolchain 'bin' }
          }
          python scripts/run-portable-tests.py --verbose

  self-hosted-canonical-build:
    if: >-
      vars.ENABLE_SELF_HOSTED_CI == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.full_build) ||
       (github.event_name == 'pull_request' && github.base_ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.author_association == 'OWNER' &&
        github.actor == github.repository_owner &&
        contains(github.event.pull_request.labels.*.name, 'full-build') &&
        (github.event.action != 'labeled' || github.event.label.name == 'full-build')))
    runs-on: [self-hosted, Windows, X64, dlss5-build]
    timeout-minutes: 150
    steps:
      - name: Locate git and python
        # The runner service may not inherit the interactive PATH. Without git on
        # PATH actions/checkout downloads an archive with no .git directory, and
        # the canonical build refuses to run without a commit identity.
        shell: powershell
        env:
          VAR_DLSS5_GIT_DIR: ${{ vars.DLSS5_GIT_DIR }}
          VAR_DLSS5_PYTHON_DIR: ${{ vars.DLSS5_PYTHON_DIR }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Add-ToolDir([string]$Exe, [string[]]$Dirs) {
            if (Get-Command $Exe -ErrorAction SilentlyContinue) { return }
            $found = $Dirs | Where-Object { $_ -and (Test-Path -LiteralPath (Join-Path $_ $Exe)) } | Select-Object -First 1
            if (-not $found) { throw "$Exe not found on PATH or in: $($Dirs -join '; '). Set the DLSS5_GIT_DIR / DLSS5_PYTHON_DIR repository variable." }
            Write-Host "Adding $found to PATH for $Exe"
            [IO.File]::AppendAllText($env:GITHUB_PATH, "$found`n")
          }
          Add-ToolDir 'git.exe' @($env:VAR_DLSS5_GIT_DIR, $env:DLSS5_GIT_DIR, "$env:ProgramFiles\Git\cmd", "${env:ProgramFiles(x86)}\Git\cmd", "$env:LOCALAPPDATA\Programs\Git\cmd")
          $pythonDirs = @($env:VAR_DLSS5_PYTHON_DIR, $env:DLSS5_PYTHON_DIR) + @(Get-ChildItem -Directory -Path "$env:LOCALAPPDATA\Programs\Python\Python3*", "$env:ProgramFiles\Python3*" -ErrorAction SilentlyContinue | Sort-Object Name -Descending | ForEach-Object FullName)
          Add-ToolDir 'python.exe' $pythonDirs
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Canonical build
        shell: powershell
        env:
          VAR_DLSS5_UPSTREAM_ROOT: ${{ vars.DLSS5_UPSTREAM_ROOT }}
          VAR_DLSS5_TOOLCHAIN_ROOT: ${{ vars.DLSS5_TOOLCHAIN_ROOT }}
          VAR_DLSS5_RESHADE_SOURCE_ROOT: ${{ vars.DLSS5_RESHADE_SOURCE_ROOT }}
          VAR_DLSS5_DIRECTXMATH_ROOT: ${{ vars.DLSS5_DIRECTXMATH_ROOT }}
          VAR_DLSS5_FACE_RUNTIME_ROOT: ${{ vars.DLSS5_FACE_RUNTIME_ROOT }}
          VAR_DLSS5_FFX_SDK_ROOT: ${{ vars.DLSS5_FFX_SDK_ROOT }}
          VAR_DLSS5_FFX_CACHE_ROOT: ${{ vars.DLSS5_FFX_CACHE_ROOT }}
          VAR_DLSS5_BUILD_ROOT: ${{ vars.DLSS5_BUILD_ROOT }}
          VAR_DLSS5_NRCHAIN_REUSE_ROOT: ${{ vars.DLSS5_NRCHAIN_REUSE_ROOT }}
          VAR_DLSS5_CODEC_CACHE_ROOT: ${{ vars.DLSS5_CODEC_CACHE_ROOT }}
          VAR_DLSS5_ALLOW_MISSING_DEBUG_LAYER: ${{ vars.DLSS5_ALLOW_MISSING_DEBUG_LAYER }}
        run: ./scripts/ci/run-self-hosted-build.ps1
