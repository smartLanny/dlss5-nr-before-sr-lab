name: Validate beta0.5 research candidate

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: beta050-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-bug-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Extracted production bug regressions
        run: |
          set -euo pipefail
          python3 scripts/validate-050-stability.py --compiler g++
          python3 scripts/validate-050-stability.py --compiler g++ --negative-control
          python3 scripts/validate-045-color.py --compiler g++
          python3 scripts/validate-045-color.py --compiler g++ --negative-control
          python3 scripts/validate-044-compat.py --compiler g++
          python3 scripts/validate-retirement-return.py --compiler g++
          python3 scripts/validate-recommended-picture.py --compiler g++
          python3 scripts/validate-recommended-picture.py --compiler g++ --negative-control
          python3 -m unittest discover -s tests -p test_evidence_checkout.py -v
          python3 scripts/validate-layered-composite.py --compiler g++
          python3 scripts/validate-strength-cap.py
          python3 scripts/validate-beta05-boost.py --compiler g++
          python3 scripts/validate-bug-sweep.py --compiler g++
          python3 scripts/validate-043r2.py --compiler g++
          python3 scripts/validate-compat-sweep.py --compiler g++
          python3 -m unittest discover -s tests -p test_feedback_report.py -v
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/feedback_text_test.cpp -o /tmp/feedback-text
          /tmp/feedback-text
          python3 -m unittest discover -s tests -p 'test_core_feedback.py'
          python3 tests/test_f8_parser.py

  shader-structure-and-math:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Structural invariants
        run: |
          python scripts/validate-beta04-structure.py
          if ($LASTEXITCODE -ne 0) { throw 'Structural/release identity validation failed' }
          python scripts/validate-beta04-result-resize.py
          if ($LASTEXITCODE -ne 0) { throw 'Result extent validation failed' }
      - name: Multiplicative HDR guide and gamut math
        run: python scripts/test-beta04-math.py
      - name: Compile every embedded Shader Model 5 entry
        shell: pwsh
        run: ./scripts/validate-codec-shader.ps1

  full-contract-build-and-package:
    needs: [host-bug-regressions, shader-structure-and-math]
    # D21 uses the exact pinned/generated integration, not the old dev4 raw
    # checkout build with two languages and an INI in the same test payload.
    # This is also the next/0.5 PR route through pull-request-validation.yml.
    uses: ./.github/workflows/multi-api-foundation.yml
    permissions:
      contents: read
