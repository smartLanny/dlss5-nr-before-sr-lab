name: Native DX11 carrier / beta0.4.2 experiment
on:
  push:
    branches: [codex/beta0.4.2-native-bridge-exp1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-carrier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CPU staging and history tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests/native_bridge -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Staging tests failed' }
      - name: Fetch pinned carrier and core build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --no-checkout https://github.com/NIGos/dlss5-bridge.git external-carrier
          git -C external-carrier checkout --detach 29baa4cc56e0aeb21219de16528e697b91522efc
          if ($LASTEXITCODE -ne 0) { throw 'Carrier checkout failed' }
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip' -OutFile llvm.zip
          Expand-Archive llvm.zip -DestinationPath toolchain
          $toolchain = (Get-ChildItem toolchain -Directory | Select-Object -First 1).FullName
          git clone --no-checkout https://github.com/crosire/reshade.git reshade-source
          git -C reshade-source checkout --detach 4a50d1eddace85734871d91792ff214f13f66c01
          git -C reshade-source submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'ReShade checkout failed' }
          "TOOLCHAIN_ROOT=$toolchain" | Out-File $env:GITHUB_ENV -Append
          "RESHADE_ROOT=$pwd\reshade-source" | Out-File $env:GITHUB_ENV -Append
      - name: Stage exact source patches and compile core
        shell: pwsh
        run: |
          python scripts/prepare-native-bridge.py --upstream external-carrier --output build/native-carrier
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source staging failed' }
          $compiler = Join-Path $env:TOOLCHAIN_ROOT 'bin\x86_64-w64-mingw32-clang++.exe'
          $env:PATH = "$(Join-Path $env:TOOLCHAIN_ROOT 'bin');$env:PATH"
          & $compiler '-std=c++17' '-static' '-Wall' '-Wextra' '-Werror' '-I.' tests/native_bridge/history.cpp '-o' history.exe
          if ($LASTEXITCODE -ne 0) { throw 'History compile failed' }
          ./history.exe
          if ($LASTEXITCODE -ne 0) { throw "History tests failed: exit=$LASTEXITCODE" }
          & $compiler '-std=c++17' '-static' '-Wall' '-Wextra' '-Werror' '-I.' tests/native_bridge/forward.cpp '-o' forward.exe
          if ($LASTEXITCODE -ne 0) { throw 'Forward routing compile failed' }
          ./forward.exe
          if ($LASTEXITCODE -ne 0) { throw "Forward routing tests failed: exit=$LASTEXITCODE" }
          ./build/native-carrier/core/scripts/build.ps1 -ToolchainRoot $env:TOOLCHAIN_ROOT -ReShadeSourceRoot $env:RESHADE_ROOT
      - name: Compile pinned external carrier with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cd build\native-carrier\carrier\src
          rc /nologo version.rc
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /O2 /MT /EHsc /std:c++17 /Ireshade /LD dlss5-bridge.cpp version.res /Fe:dlss5-native-carrier-exp1.addon64 /link /DLL user32.lib advapi32.lib bcrypt.lib
          if errorlevel 1 exit /b 1
      - name: Assemble unsigned experimental test package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $pwd 'beta0.4.2-native-bridge-exp1'
          New-Item -ItemType Directory -Path $root | Out-Null
          $core = Join-Path $pwd 'build/native-carrier/core/build'
          $carrier = Join-Path $pwd 'build/native-carrier/carrier/src/dlss5-native-carrier-exp1.addon64'
          foreach ($file in @(
            (Join-Path $core 'DLSS5-AI渲染超分版-beta0.4.2-native-bridge-exp1-@野生的装机宅-Bilibili.addon64'),
            (Join-Path $core 'DLSS5-AI-Rendering-Upscaling-beta0.4.2-native-bridge-exp1-@野生的装机宅-Bilibili.en.addon64'),
            (Join-Path $core 'nrchain_nvngx.dll'),
            (Join-Path $core 'nr_before_sr.ini'),
            $carrier,
            (Join-Path $pwd 'build/native-carrier/source-manifest.json')
          )) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing package input: $file" }
            Copy-Item -LiteralPath $file -Destination $root
          }
          @'
          DLSS 5 beta0.4.2 原生 DX11 载体实验版

          这是基于 beta0.4.2 和 PR #46 的实验包，只用于愿意提供日志的玩家。
          它让部分 DX11 原生 DLSS 游戏尝试把真实的 DLSS 输入送到 0.4.2 NR->SR 链路。
          目前没有通过真实游戏验收，也没有纳入一键安装助手。

          安装：完全退出游戏和 ReShade，备份原文件，只在同一个 Add-on 目录放一份中文或英文 addon、nrchain_nvngx.dll、dlss5-native-carrier-exp1.addon64 和 nr_before_sr.ini。不要同时启用旧版桥或其他 NR 插件。
          复测：先确认原生 DLSS 仍能工作，再看插件日志中的 Feature 18 成功次数和 transfer-submitted 是否持续增加。没有持续提交就说明桥接没有生效，应恢复原包并提交日志。
          已知边界：只接受 DX11 原生/模组 DLSS；不支持纯 DX11 无 DLSS、DX12、Vulkan、合成输入或把该包当作正式 0.4.2 使用。载体文件未经签名，不能由一键安装助手自动部署。
          '@ | Set-Content -LiteralPath (Join-Path $root '说明.txt') -Encoding utf8NoBOM
          $files = Get-ChildItem -LiteralPath $root -File | ForEach-Object {
            [ordered]@{ path = $_.Name; bytes = $_.Length; sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash }
          }
          [ordered]@{ schema='dlss5-native-bridge-experiment/v1'; build='beta0.4.2-native-bridge-exp1'; sourceCommit='15909ef10914fcdf151ee193460451667fbf31dc'; carrierCommit='29baa4cc56e0aeb21219de16528e697b91522efc'; signed=$false; files=$files } |
            ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'PACKAGE_MANIFEST.json') -Encoding utf8NoBOM
          Compress-Archive -LiteralPath (Get-ChildItem -LiteralPath $root -File | Select-Object -ExpandProperty FullName) -DestinationPath (Join-Path $pwd 'beta0.4.2-native-bridge-exp1-windows-x64.zip') -CompressionLevel Optimal
      - name: Preserve source identity and experimental package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta0.4.2-native-bridge-exp1-windows-x64
          path: |
            build/native-carrier/source-manifest.json
            beta0.4.2-native-bridge-exp1-windows-x64.zip
          if-no-files-found: ignore
