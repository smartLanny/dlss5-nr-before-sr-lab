name: Add beta0.4 r3 GPU fallback diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-gpu-fallback-diagnostics
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-gpu-fallback-diag-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Label every fallback mismatch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/codec_gpu_harness.cpp.in')
          text = path.read_text(encoding='utf-8')
          old = '''                if (variant == 1 || variant == 2 || variant == 4 ||
                    (variant == 3 && x == dx && y == dy))
                    Require(std::memcmp(&actual, &expected, 16) == 0,
                            "Identity, zero-strength, reset suppression or invalid-neural fallback changed source");
          '''
          new = '''                if (variant == 1 || variant == 2 || variant == 4 ||
                    (variant == 3 && x == dx && y == dy)) {
                    if (std::memcmp(&actual, &expected, 16) != 0) {
                        std::fprintf(stderr,
                            "fallback mismatch v2=%d variant=%d flags=%u frame=%ux%u model=%ux%u pixel=%u,%u actual=(%.9g,%.9g,%.9g,%.9g) expected=(%.9g,%.9g,%.9g,%.9g)\\n",
                            v2 ? 1 : 0, variant, flags, width, height,
                            model_width, model_height, x - dx, y - dy,
                            actual.x, actual.y, actual.z, actual.w,
                            expected.x, expected.y, expected.z, expected.w);
                        throw std::runtime_error(
                            "Identity, zero-strength, reset suppression or invalid-neural fallback changed source");
                    }
                }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'fallback assertion block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Check generated patch
        run: git diff --check
      - name: Commit diagnostic labels
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/codec_gpu_harness.cpp.in
          git commit -m "Label beta0.4 r3 GPU fallback mismatches [r3-gpu-fallback-diag-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
