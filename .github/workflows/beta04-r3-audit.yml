name: Upgrade beta0.4 r3 D3D12 GPU harness

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-gpu-harness-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-gpu-harness-fix-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Add production CombineV2CS execution coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/codec_gpu_harness.cpp.in')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '    Com<ID3D12PipelineState> pipeline;\n',
              '    Com<ID3D12PipelineState> pipeline;\n'
              '    Com<ID3D12PipelineState> v2_pipeline;\n',
              'V2 pipeline field')

          replace_once(
              '''        Check(device->CreateComputePipelineState(&pipeline_desc,
                    IID_ID3D12PipelineState, pipeline.address()), "Create compute pipeline");
          ''',
              '''        Check(device->CreateComputePipelineState(&pipeline_desc,
                    IID_ID3D12PipelineState, pipeline.address()), "Create compute pipeline");

                  Com<ID3DBlob> v2_shader, v2_errors;
                  result = D3DCompile(kCodecShader, sizeof(kCodecShader) - 1,
                      "production-codec-v2", nullptr, nullptr, "CombineV2CS", "cs_5_0",
                      D3DCOMPILE_OPTIMIZATION_LEVEL3, 0, &v2_shader.p, &v2_errors.p);
                  if (FAILED(result) && v2_errors.p != nullptr)
                      std::fprintf(stderr, "%s\\n",
                          static_cast<const char *>(v2_errors->GetBufferPointer()));
                  Check(result, "Compile production CombineV2CS");
                  pipeline_desc.CS = {v2_shader->GetBufferPointer(),
                                      v2_shader->GetBufferSize()};
                  Check(device->CreateComputePipelineState(&pipeline_desc,
                        IID_ID3D12PipelineState, v2_pipeline.address()),
                        "Create V2 compute pipeline");
          ''',
              'compile V2 pipeline')

          replace_once(
              '''RunResult Run(Gpu &gpu, UINT width, UINT height, UINT stride,
                         UINT requested_stride, UINT flags, int variant) {
          ''',
              '''RunResult Run(Gpu &gpu, UINT width, UINT height, UINT stride,
                         UINT requested_stride, UINT flags, int variant,
                         bool v2 = false, UINT requested_model_width = 0,
                         UINT requested_model_height = 0) {
          ''',
              'Run signature')

          replace_once(
              '''    constexpr UINT sx = 3, sy = 2, dx = 2, dy = 1;
              const UINT source_width = width + sx + 2, source_height = height + sy + 2;
          ''',
              '''    constexpr UINT sx = 3, sy = 2, dx = 2, dy = 1;
              const UINT model_width = requested_model_width != 0
                  ? requested_model_width : width;
              const UINT model_height = requested_model_height != 0
                  ? requested_model_height : height;
              const UINT source_width = width + sx + 2, source_height = height + sy + 2;
          ''',
              'model extent setup')

          replace_once(
              '    std::vector<Float4> proxy(width * height), neural(width * height);\n',
              '    std::vector<Float4> proxy(model_width * model_height),\n'
              '                        neural(model_width * model_height);\n',
              'model-sized vectors')

          replace_once(
              '''    for (UINT y = 0; y < height; ++y)
                  for (UINT x = 0; x < width; ++x) {
                      proxy[y * width + x] = {0.25f, 0.375f, 0.5f, 0.75f};
                      neural[y * width + x] = variant == 1 ? proxy[y * width + x]
                          : Float4{0.3f, 0.45f, 0.6f, 0.875f};
                  }
          ''',
              '''    for (UINT y = 0; y < model_height; ++y)
                  for (UINT x = 0; x < model_width; ++x) {
                      proxy[y * model_width + x] = {0.25f, 0.375f, 0.5f, 0.75f};
                      neural[y * model_width + x] = variant == 1
                          ? proxy[y * model_width + x]
                          : Float4{0.3f, 0.45f, 0.6f, 0.875f};
                  }
          ''',
              'model initialization')

          replace_once(
              '''    auto proxy_texture = gpu.MakeTexture(width, height, proxy);
              auto neural_texture = gpu.MakeTexture(width, height, neural);
          ''',
              '''    auto proxy_texture = gpu.MakeTexture(model_width, model_height, proxy);
              auto neural_texture = gpu.MakeTexture(model_width, model_height, neural);
          ''',
              'model textures')

          replace_once(
              '''    const CodecConstants constants = {width, height, 1.0f,
                  variant == 2 ? 0.0f : 0.8f, 1.0f, 0.25f, 2.0f, flags,
                  sx, sy, dx, dy, 0, 0, 0, 0, 1.0f, stride};
          ''',
              '''    const float transfer_strength = variant == 2 ? 0.0f
                  : (variant == 5 ? 8.0f : 0.8f);
              const float color_strength = variant == 5 ? 2.0f : 0.25f;
              const float max_luma_ratio = variant == 5 ? 16.0f : 2.0f;
              const float frame_confidence = variant == 4 ? 0.0f : 1.0f;
              const CodecConstants constants = {width, height, 1.0f,
                  transfer_strength, 1.0f, color_strength, max_luma_ratio, flags,
                  sx, sy, dx, dy, 0, 0, 0, 0, 1.0f, stride,
                  width, height, model_width, model_height,
                  0.0f, 0.0f, 1u, frame_confidence};
          ''',
              '26-field constants')

          replace_once(
              '    gpu.list->SetPipelineState(gpu.pipeline.p);\n',
              '    gpu.list->SetPipelineState(v2 ? gpu.v2_pipeline.p : gpu.pipeline.p);\n',
              'V2 pipeline selection')

          replace_once(
              '''                if (variant == 1 || variant == 2 || (variant == 3 && x == dx && y == dy))
                      Require(std::memcmp(&actual, &expected, 16) == 0,
                              "Identity, zero-strength or invalid-neural fallback changed source");
          ''',
              '''                if (variant == 1 || variant == 2 || variant == 4 ||
                          (variant == 3 && x == dx && y == dy))
                      Require(std::memcmp(&actual, &expected, 16) == 0,
                              "Identity, zero-strength, reset suppression or invalid-neural fallback changed source");
                  if (v2 && variant == 5)
                      Require(actual.x >= 0.0f && actual.x <= 1.0f &&
                              actual.y >= 0.0f && actual.y <= 1.0f &&
                              actual.z >= 0.0f && actual.z <= 1.0f,
                              "8x V2 colour escaped the bounded SDR cube");
          ''',
              'V2 fallback and high-strength assertions')

          replace_once(
              '''                const Float4 *expected[] = {
                      &original[(source_y + sy) * source_width + source_x + sx],
                      &proxy[source_y * width + source_x],
                      &neural[source_y * width + source_x],
                      &result.output[(source_y + dy) * output_width + source_x + dx]};
          ''',
              '''                const UINT model_index =
                      model_width == width && model_height == height
                          ? source_y * model_width + source_x : 0;
                  const Float4 *expected[] = {
                      &original[(source_y + sy) * source_width + source_x + sx],
                      &proxy[model_index],
                      &neural[model_index],
                      &result.output[(source_y + dy) * output_width + source_x + dx]};
          ''',
              'scaled capture expectations')

          replace_once(
              '''        for (UINT stride : {1u, 4u, 8u}) {
          ''',
              '''        for (int variant : {0, 1, 2, 4, 5}) {
                  const auto off = Run(gpu, 13, 9, 0, 2, 1, variant, true);
                  const auto on = Run(gpu, 13, 9, 2, 2, 1, variant, true);
                  Require(off.output.size() == on.output.size() &&
                      std::memcmp(off.output.data(), on.output.data(),
                          off.output.size() * sizeof(Float4)) == 0,
                      "V2 stage capture changes composited output");
                  ++scenarios;
              }
              Run(gpu, 13, 9, 0, 2, 1, 3, true);
              ++scenarios;
              for (int variant : {0, 1, 2, 4, 5}) {
                  const auto off = Run(gpu, 35, 17, 0, 4, 1, variant,
                                       true, 18, 9);
                  const auto on = Run(gpu, 35, 17, 4, 4, 1, variant,
                                      true, 18, 9);
                  Require(std::memcmp(off.output.data(), on.output.data(),
                      off.output.size() * sizeof(Float4)) == 0,
                      "Scaled V2 stage capture changes composited output");
                  ++scenarios;
              }
              for (UINT stride : {1u, 4u, 8u}) {
          ''',
              'V2 GPU scenarios')

          replace_once(
              '''            "capture on/off bit identity, raw four-plane values, alpha, "
                  "subrect bounds, invalid/zero/identity paths, descriptor and root layout.\\n",
          ''',
              '''            "legacy/V2 capture identity, scaled V2, 8x strength, reset "
                  "suppression, raw planes, alpha, subrects and root layout.\\n",
          ''',
              'GPU success summary')

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Check generated patch
        run: git diff --check
      - name: Commit GPU harness upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/codec_gpu_harness.cpp.in
          git commit -m "Execute beta0.4 r3 V2 in D3D12 GPU harness [r3-gpu-harness-fix-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
