name: Apply beta0.4 r3 V2 GPU harness upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-gpu-harness-upgrade
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-gpu-harness-fix-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Upgrade D3D12 codec harness
        run: python scripts/upgrade-beta04-gpu-harness.py
      - name: Check generated patch
        run: git diff --check
      - name: Commit GPU harness upgrade
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/codec_gpu_harness.cpp.in
          git commit -m "Execute beta0.4 r3 V2 in D3D12 GPU harness [r3-gpu-harness-fix-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
