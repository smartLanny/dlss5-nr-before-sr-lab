name: Apply beta0.4 perfect-chain r3 guide source hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-guide-source-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-guide-source-fix-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Fix source-to-work Jitter parameter binding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nr_before_sr.cpp')
          text = path.read_text(encoding='utf-8')
          old_x = '    if (!GetFloat(params, "Jitter.Offset.X", &jitter_x) ||\n'
          old_y = '    if (!GetFloat(params, "Jitter.Offset.Y", &jitter_y) ||\n'
          new_x = '    if (!GetFloat(sr_params, "Jitter.Offset.X", &jitter_x) ||\n'
          new_y = '    if (!GetFloat(sr_params, "Jitter.Offset.Y", &jitter_y) ||\n'
          if text.count(old_x) != 1 or text.count(old_y) != 1:
              raise SystemExit('expected Jitter parameter patterns were not found exactly once')
          text = text.replace(old_x, new_x, 1).replace(old_y, new_y, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Re-run source invariants
        run: |
          python scripts/validate-beta04-structure.py
          python scripts/test-beta04-math.py
          git diff --check
      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nr_before_sr.cpp
          git commit -m "Fix beta0.4 r3 guide parameter binding [r3-guide-source-fix-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
