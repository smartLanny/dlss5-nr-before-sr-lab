name: Apply beta0.4 perfect-chain r3 source hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-source-hotfix
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-shader-fix-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Fix bounded SDR Shader scope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/nr_before_sr.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''    const bool boundedSdrStorage = modelEncodedInput ||
                  linearSdrStorage || srgbSdrStorage;
          '''
          new = '''    const bool boundedSdrStorage =
                  (Passthrough & (1u | 16u | 32u)) != 0u;
          '''
          if old not in text:
              raise SystemExit('bounded SDR scope pattern not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Re-run source invariants
        run: |
          python scripts/validate-beta04-structure.py
          python scripts/test-beta04-math.py
          git diff --check
      - name: Commit source hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nr_before_sr.cpp
          git commit -m "Fix beta0.4 r3 bounded SDR Shader scope [r3-shader-fix-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
