name: Add beta0.4 r3 GPU fallback diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r3-gpu-fallback-diagnostics
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[r3-gpu-fallback-diag-applied]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Label every fallback mismatch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/codec_gpu_harness.cpp.in')
          text = path.read_text(encoding='utf-8')
          message = '"Identity, zero-strength, reset suppression or invalid-neural fallback changed source");'
          message_pos = text.index(message)
          block_start = text.rfind('if (variant == 1 || variant == 2 || variant == 4 ||', 0, message_pos)
          block_start = text.rfind('\n', 0, block_start) + 1
          block_end = text.index('\n', message_pos) + 1
          indent = ' ' * 16
          inner = ' ' * 20
          deep = ' ' * 24
          new = (
              indent + 'if (variant == 1 || variant == 2 || variant == 4 ||\n' +
              inner + '(variant == 3 && x == dx && y == dy)) {\n' +
              inner + 'if (std::memcmp(&actual, &expected, 16) != 0) {\n' +
              deep + 'std::fprintf(stderr,\n' +
              deep + '    "fallback mismatch v2=%d variant=%d flags=%u frame=%ux%u model=%ux%u pixel=%u,%u actual=(%.9g,%.9g,%.9g,%.9g) expected=(%.9g,%.9g,%.9g,%.9g)\\n",\n' +
              deep + '    v2 ? 1 : 0, variant, flags, width, height,\n' +
              deep + '    model_width, model_height, x - dx, y - dy,\n' +
              deep + '    actual.x, actual.y, actual.z, actual.w,\n' +
              deep + '    expected.x, expected.y, expected.z, expected.w);\n' +
              deep + 'throw std::runtime_error(\n' +
              deep + '    "Identity, zero-strength, reset suppression or invalid-neural fallback changed source");\n' +
              inner + '}\n' +
              indent + '}\n')
          if block_start <= 0 or block_end <= block_start:
              raise SystemExit('could not isolate fallback assertion block')
          path.write_text(text[:block_start] + new + text[block_end:],
                          encoding='utf-8', newline='\n')
          PY
      - name: Check generated patch
        run: git diff --check
      - name: Commit diagnostic labels
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/codec_gpu_harness.cpp.in
          git commit -m "Label beta0.4 r3 GPU fallback mismatches [r3-gpu-fallback-diag-applied]"
          git push origin HEAD:codex/beta0.4-perfect-chain
