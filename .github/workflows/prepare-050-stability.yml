name: Prepare verified 0.5 stability objects
on:
  push:
    branches: [codex/050-stability-preparation]
    paths: [.github/workflows/prepare-050-stability.yml, scripts/prepare-050-stability.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable inputs and execute production regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-050-stability.py
