name: Prepare verified 0.5 stability objects
on:
  push:
    branches: [codex/050-stability-preparation]
    paths: [.github/workflows/prepare-050-stability.yml, scripts/prepare-050-stability.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable inputs and execute production regressions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-050-stability.py')
          script=p.read_text(encoding='utf-8')
          old="['git','diff','--cached','--check']"
          assert script.count(old)==1
          # The imported raw archive is byte-identical to B and includes original whitespace.
          # Check all authored differences against B without rewriting archived user evidence.
          script=script.replace(old,"['git','diff','--check',B,final]")
          exec(compile(script,str(p),'exec'))
          PY
