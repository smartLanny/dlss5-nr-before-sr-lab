name: DX11 r3 carrier and real-render query experiment
on:
  push:
    branches: [codex/dx11-r3-render-control]
  pull_request:
    branches: [release/0.4, main]
    paths: ['src/interop/**', 'scripts/prepare-native-bridge*', 'tests/native_bridge/**', '.github/workflows/native-bridge-r3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-r3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Staging and production-source checks
        shell: pwsh
        run: |
          Write-Output 'CORE STATUS BEFORE TESTS'
          git status --porcelain --untracked-files=no
          git diff --stat
          python -m unittest discover -s tests/native_bridge -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Fetch pinned build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --no-checkout https://github.com/NIGos/dlss5-bridge.git external-carrier
          git -C external-carrier checkout --detach 29baa4cc56e0aeb21219de16528e697b91522efc
          if ($LASTEXITCODE -ne 0) { throw 'Carrier checkout failed' }
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip' -OutFile llvm.zip
          Expand-Archive llvm.zip -DestinationPath toolchain
          $toolchain = (Get-ChildItem toolchain -Directory | Select-Object -First 1).FullName
          git clone --no-checkout https://github.com/crosire/reshade.git reshade-source
          git -C reshade-source checkout --detach 4a50d1eddace85734871d91792ff214f13f66c01
          git -C reshade-source submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'ReShade checkout failed' }
          "TOOLCHAIN_ROOT=$toolchain" | Out-File $env:GITHUB_ENV -Append
          "RESHADE_ROOT=$pwd\reshade-source" | Out-File $env:GITHUB_ENV -Append
      - name: Stage exact r3 source, CPU regressions and bilingual core build
        shell: pwsh
        run: |
          Write-Output 'CORE STATUS BEFORE STAGING'
          git status --porcelain --untracked-files=no
          git diff --stat
          Write-Output 'UPSTREAM STATUS BEFORE STAGING'
          git -C external-carrier status --porcelain --untracked-files=no
          git -C external-carrier diff --stat
          python scripts/prepare-native-bridge-r3.py --upstream external-carrier --output build/native-r3
          if ($LASTEXITCODE -ne 0) { throw 'Pinned staging failed' }
          $compiler = Join-Path $env:TOOLCHAIN_ROOT 'bin\x86_64-w64-mingw32-clang++.exe'
          $env:PATH = "$(Join-Path $env:TOOLCHAIN_ROOT 'bin');$env:PATH"
          foreach ($test in @('history','forward','render_scale')) {
            & $compiler '-std=c++17' '-static' '-Wall' '-Wextra' '-Werror' '-I.' "tests/native_bridge/$test.cpp" '-o' "$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test compile failed" }
            & "./$test.exe"
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }
          ./build/native-r3/core/scripts/build.ps1 -ToolchainRoot $env:TOOLCHAIN_ROOT -ReShadeSourceRoot $env:RESHADE_ROOT
      - name: MSVC carrier and actual private-baseline WARP smoke
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /W4 /O2 /MT /EHsc /std:c++17 /I. tests\native_bridge\baseline_warp.cpp /Fe:baseline_warp.exe
          if errorlevel 1 exit /b 1
          baseline_warp.exe
          if errorlevel 1 exit /b 1
          cd build\native-r3\carrier\src
          rc /nologo version.rc
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /O2 /MT /EHsc /std:c++17 /Ireshade /LD dlss5-bridge.cpp version.res /Fe:dlss5-native-carrier-r3-exp2.addon64 /link /DLL user32.lib advapi32.lib bcrypt.lib
          if errorlevel 1 exit /b 1
      - name: Package experimental test candidates, not a Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build/candidate | Out-Null
          $addons = @(Get-ChildItem build/native-r3/core/build/*.addon64)
          if ($addons.Count -ne 2) { throw 'Expected exactly two language builds' }
          foreach ($addon in $addons) {
            $package = Join-Path 'build/packages' $addon.BaseName
            New-Item -ItemType Directory -Force $package | Out-Null
            Copy-Item $addon.FullName $package/
            Copy-Item build/native-r3/core/build/nrchain_nvngx.dll $package/
            Copy-Item build/native-r3/core/build/nr_before_sr.ini $package/
            Copy-Item build/native-r3/carrier/src/dlss5-native-carrier-r3-exp2.addon64 $package/
            Copy-Item build/native-r3/source-manifest.json $package/
            Copy-Item build/native-r3/carrier/LICENSE $package/LICENSE-carrier.txt
            Copy-Item docs/interop/DX11_R3_EXPERIMENT.md $package/README.md
            Get-ChildItem $package -File | Get-FileHash -Algorithm SHA256 | Select-Object @{Name='File';Expression={Split-Path $_.Path -Leaf}},Hash | ConvertTo-Json | Set-Content $package/SHA256.json
            Compress-Archive -Path "$package/*" -DestinationPath "build/candidate/$($addon.BaseName).zip"
          }
          Copy-Item docs/interop/DX11_R3_EXPERIMENT.md build/candidate/README-choose-one-language.md
          Get-ChildItem build/candidate -File | Get-FileHash -Algorithm SHA256 | Select-Object @{Name='File';Expression={Split-Path $_.Path -Leaf}},Hash | ConvertTo-Json | Set-Content build/candidate/SHA256.json
      - uses: actions/upload-artifact@v4
        with:
          name: dx11-r3-exp2-NOT-runtime-verified
          path: build/candidate/
          if-no-files-found: error
