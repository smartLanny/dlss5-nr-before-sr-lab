name: Public final-strength cap
on:
  pull_request:
    branches: [main, release/0.4, next/0.5, codex/050-high-strength-guard]
permissions:
  contents: read
jobs:
  production-return-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 647ac292433bf00506eead16ccda1a30c2b3a153
          path: historical-control
          persist-credentials: false
      - name: Historical production must fail exact oracle
        run: python3 scripts/validate-strength-cap.py --source historical-control/src/nr_before_sr.cpp --expect-rejection
      - name: Current production must pass
        run: python3 scripts/validate-strength-cap.py
