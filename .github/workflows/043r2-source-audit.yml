name: R2 source audit
on:
  push:
    branches: [codex/043r2-compat-feedback-ux]
    paths: [.github/workflows/043r2-source-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect actual strength, reset completion and dispatch code
        shell: python
        run: |
          from pathlib import Path
          s=Path('src/nr_before_sr.cpp').read_text()
          for key in ['float ActiveTransferStrength(', 'void CompleteNrDiagnosticEvaluation(', 'void DispatchCodec(']:
              p=s.index(key);b=s.index('{',p);depth=0
              for e in range(b,len(s)):
                  if s[e]=='{':depth+=1
                  elif s[e]=='}':
                      depth-=1
                      if not depth:break
              print('FUNCTION',key,'LINE',s[:p].count('\n')+1)
              print(s[p:e+1])
          for i,line in enumerate(s.splitlines()):
              if 'post_transfer_strength' in line:print('FIELD',i+1,line)
