name: Stage 043 feedback source blobs
on:
  push:
    branches: [codex/043-feedback-and-triage]
    paths:
      - scripts/materialize-043-feedback.py
      - .github/workflows/materialize-043-feedback.yml
permissions:
  contents: write
jobs:
  source-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact-source integration and test portable seams
        run: |
          python3 scripts/materialize-043-feedback.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nr_diagnostic_bundle.inl')
          s=p.read_text()
          old='return std::min(job.archive_limit, kArchiveLimit);'
          assert s.count(old)==1
          p.write_text(s.replace(old,'return job.archive_limit < kArchiveLimit ? job.archive_limit : kArchiveLimit;'))
          PY
          git diff --check
          python3 scripts/validate-bug-sweep.py --compiler g++
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/feedback_text_test.cpp -o /tmp/feedback-text
          /tmp/feedback-text
          python3 -m unittest discover -s tests -p 'test_core_feedback.py'
          python3 tests/test_f8_parser.py
      - name: Publish source blobs only (no commit or ref updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='smartLanny/dlss5-nr-before-sr-lab'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/043-feedback-and-triage'
          allowed={'src/nr_before_sr.cpp','src/nr_f8_sequence.inl','src/nr_diagnostic_bundle.inl','src/nr_feedback_core.inl','tests/f8_controller_harness.cpp.in','src/nr_settings_ui.inl','config/nr_before_sr.ini','.github/workflows/beta042-validate.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==allowed,(changed,allowed)
          for path in sorted(changed):
              data=Path(path).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/smartLanny/dlss5-nr-before-sr-lab/git/blobs',data=json.dumps({'content':data.decode('utf-8'),'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  sha=json.load(response)['sha']
              assert sha==expected
              print('REVIEW_BLOB '+json.dumps({'path':path,'mode':'100644','type':'blob','sha':sha}),flush=True)
          PY
