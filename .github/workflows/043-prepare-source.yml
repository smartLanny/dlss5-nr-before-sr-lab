name: Prepare audited 043 source blob
on:
  push:
    branches: [codex/043-source-preparation]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'smartLanny/dlss5-nr-before-sr-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare immutable source object only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, pathlib, urllib.request
          path = pathlib.Path('src/nr_before_sr.cpp')
          before = path.read_bytes()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert blob_sha(before) == '11dd6d0653a739e6b3aff48dd2d1605f2b629f0c', 'reviewed source moved'
          anchor = b'#include "nr_guide_contract.h"'
          assert before.count(anchor) == 1
          after = before.replace(anchor, anchor + b'\n// Standard-library feedback dependencies must be included at global scope.\n#include "nr_feedback_text.h"')
          request = urllib.request.Request(
              'https://api.github.com/repos/smartLanny/dlss5-nr-before-sr-lab/git/blobs',
              data=json.dumps({'content': after.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'},
              method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          assert result['sha'] == blob_sha(after)
          print('AUDITED_SOURCE_BLOB=' + result['sha'])
          print('SOURCE_BYTES=' + str(len(after)))
          print('Only an immutable blob was written; no tree, commit, branch or PR was changed.')
