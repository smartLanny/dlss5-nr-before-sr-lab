name: Manager prototype checks

on:
  push:
    branches:
      - product/china-manager-prototype
    paths:
      - 'manager-prototype/**'
      - '.github/workflows/manager-prototype-check.yml'
  pull_request:
    paths:
      - 'manager-prototype/**'
      - '.github/workflows/manager-prototype-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Electron main process syntax
        run: node --check manager-prototype/main.js
      - name: Check preload syntax
        run: node --check manager-prototype/preload.js
      - name: Check renderer syntax
        run: node --check manager-prototype/src/app.js
