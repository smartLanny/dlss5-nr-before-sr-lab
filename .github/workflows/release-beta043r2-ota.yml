name: Publish beta0.4.3r2 OTA only

on:
  push:
    branches: [codex/beta0.4.2]
    paths:
      - '.github/workflows/release-beta043r2-ota.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch public build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmUrl = 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-x86_64.zip'
          $reshadeCommit = '4a50d1eddace85734871d91792ff214f13f66c01'
          Invoke-WebRequest $llvmUrl -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath toolchain
          $toolchain = (Get-ChildItem toolchain -Directory | Select-Object -First 1).FullName
          git clone --depth 1 --no-checkout https://github.com/crosire/reshade.git reshade-source
          git -C reshade-source fetch --depth 1 origin $reshadeCommit
          git -C reshade-source checkout --detach $reshadeCommit
          git -C reshade-source submodule update --init --recursive --depth 1
          "TOOLCHAIN_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RESHADE_ROOT=$pwd\reshade-source" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build clean release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/build.ps1 -Clean -ToolchainRoot $env:TOOLCHAIN_ROOT -ReShadeSourceRoot $env:RESHADE_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Create OTA packages only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/package-beta03.ps1 -ReleaseRoot "$pwd\ota-r2" -UpdateOnly
          $zh = @(Get-ChildItem ota-r2 -File -Filter '*中文轻量更新包.zip')
          $en = @(Get-ChildItem ota-r2 -File -Filter '*English-Update.zip')
          if ($zh.Count -ne 1 -or $en.Count -ne 1) { throw 'Expected exactly one Chinese and one English OTA package' }
          Copy-Item -LiteralPath $zh[0].FullName -Destination 'DLSS5-beta0.4.3r2-Chinese-OTA.zip'
          Copy-Item -LiteralPath $en[0].FullName -Destination 'DLSS5-beta0.4.3r2-English-OTA.zip'
          Get-FileHash -Algorithm SHA256 'DLSS5-beta0.4.3r2-Chinese-OTA.zip','DLSS5-beta0.4.3r2-English-OTA.zip' | Format-Table

      - name: Publish prerelease with OTA assets only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view beta0.4.3r2 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'beta0.4.3r2 release already exists; refusing to overwrite it' }
          $global:LASTEXITCODE = 0
          @'
          beta0.4.3r2 是 beta0.4.3 的第二轮维护更新，合入 PR #61。

          主要变化：后置 NR 先保留游戏原生 SR 输出再取私有快照；重置/曝光/guide 变化帧不再误合成；设置页拆分画质、反馈与诊断；F8 增加可复制的脱敏报告摘要和离线报告生成。

          Release 仅提供 OTA 更新包，不包含完整安装包、裸 addon、运行库或额外校验附件。

          验证：source-level / compile / CI / D3D12 WARP 已通过；尚未宣称真实 NVIDIA DLSSNR 游戏运行时、画质与性能矩阵已完成。
          '@ | Set-Content -Encoding utf8NoBOM release-notes.md
          gh release create beta0.4.3r2 `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'DLSS5 NR beta0.4.3r2｜维护更新' `
            --notes-file release-notes.md `
            --prerelease `
            'DLSS5-beta0.4.3r2-Chinese-OTA.zip#中文 OTA 更新包' `
            'DLSS5-beta0.4.3r2-English-OTA.zip#English OTA update'
