name: Public Windows canonical candidate - software/WARP, not game verified
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: public-windows-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  host:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Actual policies, RR execution, settings and source composition
        env:
          CXX: ${{ matrix.compiler }}
          POST_COMPAT_CORE_SOURCE: src/nr_before_sr.cpp
          MULTIAPI_CORE_SOURCE: src/nr_before_sr.cpp
        run: |
          set -euo pipefail
          for test in post_policy rr_post_runtime post_settings motion_access; do
            "$CXX" -std=c++17 -Wall -Wextra -Werror -I. "tests/multi_api/$test.cpp" -o "$RUNNER_TEMP/$test"
            "$RUNNER_TEMP/$test"
          done
          python3 -m unittest discover -s tests/multi_api -v
      - name: Sanitizers
        if: matrix.compiler == 'clang++'
        run: |
          set -euo pipefail
          for test in post_policy rr_post_runtime post_settings motion_access; do
            clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined -I. "tests/multi_api/$test.cpp" -o "$RUNNER_TEMP/$test-san"
            "$RUNNER_TEMP/$test-san"
          done
  windows:
    needs: host
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Initialize evidence and source identity
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path build/cloud-evidence -Force | Out-Null
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE) { throw 'Cannot identify checked-out source' }
          $version = (Get-Content scripts/core-source-layout.json -Raw | ConvertFrom-Json).product.version
          "sha=$source" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          [ordered]@{source_commit=$source; candidate=$version; image_os=$env:ImageOS; image_version=$env:ImageVersion; game_verified=$false; nvidia_inference_verified=$false} | ConvertTo-Json | Set-Content build/cloud-evidence/run.json -Encoding utf8
      - name: Windows process receipt contracts before dependency setup
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/process-contracts.log
          try {
            & ./tests/post_scaled_work_receipt.ps1 -Validator ./scripts/validate-post-scaled-work-gpu.ps1
            & ./tests/warp_runtime_comparison.ps1 -Comparison ./scripts/ci/compare-warp-runtime.ps1 -Validator ./scripts/validate-post-scaled-work-gpu.ps1
            & ./tests/warp_runtime_timeout.ps1 -Comparison ./scripts/ci/compare-warp-runtime.ps1
            & ./tests/hosted_visual_cpp_discovery.ps1 -Bootstrap ./scripts/ci/prepare-hosted-windows.ps1
          } finally { Stop-Transcript }
      - name: Pin the test-only Microsoft WARP runtime and check evidence contracts
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/warp-runtime-evidence-contracts.log
          try {
            & ./scripts/ci/prepare-warp-runtime.ps1 -ReceiptPath build/cloud-evidence/warp-runtime.json
            & ./tests/ci_warp_runtime_evidence.ps1 -Verifier ./scripts/ci/verify-warp-runtime.ps1 -RuntimeReceipt build/cloud-evidence/warp-runtime.json
          } finally { Stop-Transcript }
      - name: Pinned complete build dependencies, face and AMD SDK cache
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/dependencies.log
          try {
            ./scripts/ci/prepare-hosted-windows.ps1 -DependencyRoot (Join-Path $env:RUNNER_TEMP 'dlss5-build-inputs') -ReceiptPath build/cloud-evidence/inputs.json
          } finally { Stop-Transcript }
      - name: Actual native WARP loader and Python child process contracts
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/warp-runtime-contracts.log
          try {
            & ./scripts/ci/validate-warp-runtime.ps1 -ToolchainRoot $env:TOOLCHAIN_ROOT -Receipt build/cloud-evidence/warp-runtime.json -OutputRoot build/warp-runtime-contracts
          } finally { Stop-Transcript }
      - name: Actual packaging contracts and dependency negative controls
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/packaging-contracts.log
          try {
            python -m unittest discover -s tests -p test_lockperf2_workflow.py -v
            if ($LASTEXITCODE) { throw 'Unified workflow routing regression' }
            python -m unittest discover -s tests/multi_api -p test_candidate_packaging.py -v
            if ($LASTEXITCODE) { throw 'Actual packaging contract regression' }
          } finally { Stop-Transcript }
      - name: Full post-scaling WARP preflight with native failure evidence
        id: post_warp
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/post-warp-preflight.log
          try {
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/preflight -Phase Begin
            & ./scripts/validate-post-scaled-work-gpu.ps1 -SourceRoot (Get-Location).Path -ToolchainRoot $env:TOOLCHAIN_ROOT -OutputRoot build/post-warp-preflight
            if ($LASTEXITCODE) { throw 'Post-scaling WARP preflight failed; retain native failure evidence' }
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/preflight -Phase End -RequiredSites 'post-scaled-work'
          } finally { Stop-Transcript }
      - name: Compare the same failed test executable with pinned Microsoft WARP
        if: failure() && steps.post_warp.outcome == 'failure'
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/warp-runtime-comparison.log
          try {
            & ./scripts/ci/compare-warp-runtime.ps1 -ExistingExe build/post-warp-preflight/post_scaled_work_gpu.exe -BaselineReceipt build/post-warp-preflight/post-scaled-work-result.json -OutputRoot build/warp-runtime-comparison
          } finally { Stop-Transcript }
      - name: Full canonical source, CPU, SM5 shaders, WARP and bilingual Core
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/canonical.log
          try {
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/canonical -Phase Begin
            & ./scripts/build-unified-candidate.ps1 -UpstreamRoot $env:UPSTREAM_ROOT -ToolchainRoot $env:TOOLCHAIN_ROOT -ReShadeSourceRoot $env:RESHADE_SOURCE_ROOT -DirectXMathRoot $env:DIRECTXMATH_ROOT -FaceRuntimeRoot $env:FACE_RUNTIME_ROOT -FfxSdkRoot $env:DLSS5_FFX_SDK_ROOT -FfxCacheRoot $env:DLSS5_FFX_CACHE_ROOT -OutputRoot build/canonical
            if ($LASTEXITCODE) { throw 'Exact staged candidate validation failed' }
            $sites = @('post-scaled-work','queue-retirement','codec-gpu','command-state-gpu','command-state-native','command-state-native-default','command-state-native-record','command-state-pristine-null','command-state-vrs-null','pipeline-cache','allocation-ledger','allocation-ledger-spatial','temporal-budget','source-transport','post-sr-snapshot','format-view','native-baseline','aux-shader','private-sr-quality','temporal-quality')
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/canonical -Phase End -RequiredSites $sites
          } finally { Stop-Transcript }
      - name: Actual face tracker and pinned CPU worker gate
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/face.log
          try {
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/face -Phase Begin
            & ./scripts/validate-face-runtime.ps1 -ToolchainRoot $env:TOOLCHAIN_ROOT -FaceRuntimeRoot $env:FACE_RUNTIME_ROOT -FaceModelPath (Join-Path $env:FACE_MODEL_ROOT 'yunet-dynamic.onnx') -OutputRoot build/canonical.face-checks
            if ($LASTEXITCODE) { throw 'Full face runtime validation failed' }
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/face -Phase End -RequiredSites 'replay-gpu'
          } finally { Stop-Transcript }
      - name: Temporal CPU contract and actual Core WARP consumer
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/temporal.log
          try {
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/temporal -Phase Begin
            $compiler = Join-Path $env:TOOLCHAIN_ROOT 'bin/x86_64-w64-mingw32-clang++.exe'
            python experiments/final_residual/validate.py --compiler $compiler --output build/canonical.temporal-cpu
            if ($LASTEXITCODE) { throw 'Temporal history contract failed' }
            python scripts/validate-native-color-view.py --compiler $compiler --reshade $env:RESHADE_SOURCE_ROOT --source build/canonical/source/core/src/nr_before_sr.cpp --output build/canonical.temporal-core --temporal
            if ($LASTEXITCODE) { throw 'Actual temporal Core WARP consumer failed' }
            python scripts/validate-native-color-view.py --compiler $compiler --reshade $env:RESHADE_SOURCE_ROOT --source build/canonical/source/core/src/nr_before_sr.cpp --output build/canonical.temporal-wrong-p1 --temporal --temporal-negative
            if ($LASTEXITCODE) { throw 'Wrong-P1 negative control was not rejected' }
            & ./scripts/ci/verify-warp-runtime.ps1 -Receipt build/cloud-evidence/warp-runtime.json -EvidenceDirectory build/cloud-evidence/warp/temporal -Phase End -RequiredSites 'queue-retirement'
          } finally { Stop-Transcript }
      - name: Package current Core-only languages with receipts and licenses
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build/cloud-evidence/package.log
          try {
            ./scripts/ci/package-hosted-candidate.ps1 -BuildRoot build/canonical -OutputRoot build/cloud-packages
          } finally { Stop-Transcript }
      - name: Upload verified Core-only candidates (no NVIDIA runtimes)
        uses: actions/upload-artifact@v4
        with:
          name: Core-${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}-NOT-game-verified
          path: |
            build/cloud-packages/**/*.zip
            build/cloud-packages/**/package-receipt.json
            build/cloud-packages/**/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Retain dependency build logs even on failure
        if: always()
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'dlss5-build-inputs/ffx-opticalflow-build'
          if (Test-Path -LiteralPath $cache) {
            New-Item -ItemType Directory -Path build/cloud-evidence/ffx -Force | Out-Null
            Get-ChildItem -LiteralPath $cache -File | Where-Object { $_.Extension -in @('.json', '.log') } | Copy-Item -Destination build/cloud-evidence/ffx
          }
      - name: Upload software/WARP evidence, including failed-step logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-evidence-${{ steps.source.outputs.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/**/*.json
            build/**/*.txt
            build/**/*.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 9
