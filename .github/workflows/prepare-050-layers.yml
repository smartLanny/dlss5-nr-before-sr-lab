name: Prepare beta0.5 layered source objects
on:
  push:
    branches: [codex/050-layered-source-preparation]
    paths:
      - .github/workflows/prepare-050-layers.yml
      - scripts/prepare-050-layers.py
      - scripts/validate-layered-composite.py
      - tests/layered_composite_gpu.inl
      - docs/BETA_0_5_LAYERS.md
permissions:
  contents: read
concurrency:
  group: prepare-050-layered
  cancel-in-progress: true
jobs:
  prepare:
    if: github.repository == 'smartLanny/dlss5-nr-before-sr-lab' && github.ref == 'refs/heads/codex/050-layered-source-preparation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2f070400b19595774bf3fa6b4d46ea2e6c64adf3
          path: cap-input
          persist-credentials: false
      - name: Import pinned cap commit into local object database
        run: git fetch --update-shallow ./cap-input 2f070400b19595774bf3fa6b4d46ea2e6c64adf3
      - name: Prepare and validate source without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          fixture = Path('scripts/validate-layered-composite.py')
          data = fixture.read_text(encoding='utf-8')
          assert data.count('return 1;++checks;') == 1
          fixture.write_text(data.replace('return 1;++checks;', 'return 1;\n++checks;'), encoding='utf-8')
          script = Path('scripts/prepare-050-layers.py').read_text(encoding='utf-8')
          replacements = {
              'source = once(source, anchor, new + anchor)': r"source = once(source, '\n' + anchor, '\n' + new + anchor)",
              "feedback = once(feedback, '      - next/0.5\\n', '      - next/0.5\\n      - codex/050-high-strength-guard\\n')": "pr, pushes = feedback.split('  push:', 1)\npr = once(pr, '      - next/0.5\\n', '      - next/0.5\\n      - codex/050-high-strength-guard\\n')\nfeedback = pr + '  push:' + pushes",
          }
          for old, new in replacements.items():
              assert script.count(old) == 1, old
              script = script.replace(old, new)
          exec(compile(script, 'prepare-050-layers.py', 'exec'))
          PY
