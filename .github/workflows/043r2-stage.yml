name: Stage reviewed r2 integration
on:
  push:
    branches: [codex/043r2-compat-feedback-ux]
    paths: [.github/workflows/043r2-stage.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed integration and publish immutable source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='smartLanny/dlss5-nr-before-sr-lab'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/043r2-compat-feedback-ux'
          expected={
              'src/nr_before_sr.cpp':'64787651fedab17c3f5a0d4145e88fe5f1292293',
              'src/nr_settings_ui.inl':'43ad0257fb0991ea63af1013b2e895da5c5c5de0',
              'src/nr_f8_sequence.inl':'019ae5689aac2d4ca07a7e7498ba3cbf0fd3f91c',
              'src/nr_feedback_core.inl':'176f31ba0eb4418efb505aef37bd8614f76152c7',
              'src/nr_feedback_text.h':'74bbd2b1b9d4e564650150b4947ef94709fe2542',
              'scripts/validate-core-feedback.py':'6da58dc1d12f458d4dbb73f269f46ccc3cb98644',
              '.github/workflows/beta042-validate.yml':'6179d7da1373d51834734ac62444698c7491bd79',
          }
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          texts={}
          for p,sha in expected.items():
              data=Path(p).read_bytes();assert blob(data)==sha,p
              texts[p]=data.decode('utf-8')
          def edit(p,old,new):
              assert texts[p].count(old)==1,(p,old,texts[p].count(old))
              texts[p]=texts[p].replace(old,new)
          cpp='src/nr_before_sr.cpp'
          edit(cpp,'#include "nr_feedback_text.h"','#include "nr_feedback_text.h"\n#include "nr_feedback_ticket.h"')
          edit(cpp,'        slot.snapshots_native_output =\n            contract != PostSrStorageContract::Fp16;',
              '        // Native SR keeps its own Output; FP16 uses an exact copy, packed formats use the codec.\n        slot.snapshots_native_output = true;')
          edit(cpp,'    if (slot.snapshots_native_output) {',
              '    if (slot.snapshots_native_output &&\n        slot.result_format != DXGI_FORMAT_R16G16B16A16_FLOAT) {')
          edit(cpp,'        const bool snapshot = contract != PostSrStorageContract::Fp16;',
              '        const bool snapshot = true; // FP16 copy and packed shader snapshots both retain native Output.')
          old='''    if (!slot->snapshots_native_output) {
                  Transition(command_list, slot->source, slot->source_state,
                             D3D12_RESOURCE_STATE_UNORDERED_ACCESS);
                  substitution.redirected_output = true;
                  SetResource(substitution.params, "Output", slot->source);
                  SetUInt(substitution.params, "DLSS.Output.Subrect.Base.X", 0);
                  SetUInt(substitution.params, "DLSS.Output.Subrect.Base.Y", 0);
              }
          '''
          edit(cpp,old,'    // No Output/subrect mutation: native SR completes before the private snapshot.\n')
          edit(cpp,'bool DispatchPostSrNativeSnapshot(',
              '#include "nr_post_sr_snapshot.inl"\n\nbool DispatchPostSrNativeSnapshot(')
          edit(cpp,'    if (slot.snapshot_heap == nullptr || slot.source == nullptr ||',
              '    if (slot.source == nullptr ||')
          anchor='''        !TextureContainsRegion(slot.source, 0, 0,
                                         substitution.width, substitution.height))
                  return false;
          '''
          edit(cpp,anchor,anchor+'''
              if (slot.result_format == DXGI_FORMAT_R16G16B16A16_FLOAT)
                  return CopyPostSrFp16Snapshot(command_list, slot.result, slot.result_state,
                      slot.source, slot.source_state, substitution.output_base_x,
                      substitution.output_base_y, substitution.width, substitution.height);
              if (slot.snapshot_heap == nullptr) return false;
          ''')
          edit(cpp,'''    if (g_config.identity_use_original ||
                  context.successful_evaluations_since_reset <= g_config.warmup_after_create) {''',
              '''    if (KeepNativePostSrImage(g_config.identity_use_original,
                      slot.suppress_transfer_this_frame,
                      context.successful_evaluations_since_reset, g_config.warmup_after_create)) {''')
          anchor='    if (slot.converts_source_format) {\n        Log("SceneColor format conversion enabled: %s -> "'
          edit(cpp,anchor,'''    if (post_sr && slot.result_format == DXGI_FORMAT_R16G16B16A16_FLOAT)
                  Log("Post-SR native FP16 Output retained: active=%ux%u copied byte-exactly to owned snapshot; no SR target redirection.", width, height);
          '''+anchor)
          core='src/nr_feedback_core.inl'
          edit(core,'#include "nr_feedback_text.h"','#include "nr_feedback_text.h"\n#include "nr_feedback_ticket.h"')
          edit(core,'char g_reason[160] = {}; // g_feedback_lock',
              'char g_reason[160] = {}; // g_feedback_lock\nchar g_submission[nr_feedback_ticket::kCapacity] = {}; // same session, g_feedback_lock')
          edit(core,'    g_reason[0] = 0; g_feedback_last_zip[0] = 0;',
              '    g_reason[0] = 0; g_feedback_last_zip[0] = 0; g_submission[0] = 0;')
          edit(core,'void Publish(const nr_bundle::Result &result, bool complete, const char *reason) {',
              '''void Publish(const nr_bundle::Result &result, bool complete, const char *reason,
                       const char *report = nullptr) {
              char submission[nr_feedback_ticket::kCapacity] = {};
              if (result.zip_path[0])
                  nr_feedback_ticket::Build(submission, sizeof(submission), report,
                      complete && result.required_complete);
          ''')
          edit(core,'    nr_bundle::CopyText(g_reason, sizeof(g_reason), reason);',
              '    nr_bundle::CopyText(g_reason, sizeof(g_reason), reason);\n    nr_bundle::CopyText(g_submission, sizeof(g_submission), submission);')
          edit(core,'"core logs collected; no image readback requested");',
              '"core logs collected; no image readback requested", s.report);')
          seq='src/nr_f8_sequence.inl'
          anchor='''        if(path[0]){ImGui::TextWrapped("%s",path);if(ImGui::Button(zh?"复制核心包路径":"Copy core path"))ImGui::SetClipboardText(path);}'''
          edit(seq,anchor,anchor+'''
                  char submission[nr_feedback_ticket::kCapacity] = {};
                  AcquireSRWLockShared(&g_feedback_lock);
                  nr_bundle::CopyText(submission, sizeof(submission), nr_core_feedback::g_submission);
                  ReleaseSRWLockShared(&g_feedback_lock);
                  if (path[0] && submission[0] && ImGui::Button(zh?"复制报告摘要（粘贴后补充现象）":"Copy report summary"))
                      ImGui::SetClipboardText(submission);
          ''')
          edit(seq,'    DrawCoreStatus();',
              '''    ImGui::TextWrapped("%s", use_chinese_ui
                  ? "不生效或旁路：先采 F8 核心小包。颜色、闪烁等画面异常：再用 F7，并提交新生成的一对包。"
                  : "Bypass or no effect: start with the small F8 core package. Visual issues: use F7 and submit its NEW core/image pair.");
              DrawCoreStatus();''')
          ui='src/nr_settings_ui.inl'
          edit(ui,'''    if (ImGui::SliderFloat(ui("Final effect strength", "最终效果强度"),
                      &next.transfer_strength, 0.0f, maximum_strength, "%.2f")) {
                  next.post_transfer_strength = next.transfer_strength; changed = true;
              }''',
              '''    float effect_strength = ActiveTransferStrength(next);
              if (ImGui::SliderFloat(ui("Final effect strength", "最终效果强度"),
                      &effect_strength, 0.0f, maximum_strength, "%.2f")) {
                  next.transfer_strength = next.post_transfer_strength = effect_strength; changed = true;
              }''')
          anchor='#if defined(NR_HAS_F8_SEQUENCE)\n    const bool collecting = nr_f8::IsActive();'
          edit(ui,anchor,'''    if (ImGui::BeginTabBar("nr-main-tabs")) {
              if (ImGui::BeginTabItem(ui("Picture", "画质"))) {
          '''+anchor)
          edit(ui,'    nr_f8::DrawControls();\n#else',
              '''#endif
                  ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem(ui("Feedback", "反馈与报告"))) {
          #if defined(NR_HAS_F8_SEQUENCE)
                  nr_f8::DrawControls();
          #else''')
          edit(ui,'''    if (ImGui::CollapsingHeader(ui("Diagnostics", "诊断"))) {
                  ImGui::PushID("technical"); DrawTechnicalDiagnostics(runtime); ImGui::PopID();
              }
              if (changed)''',
              '''        ImGui::EndTabItem();
              }
              if (ImGui::BeginTabItem(ui("Diagnostics", "诊断"))) {
                  ImGui::PushID("technical"); DrawTechnicalDiagnostics(runtime); ImGui::PopID();
                  ImGui::EndTabItem();
              }
              ImGui::EndTabBar();
              }
              if (changed)''')
          h='src/nr_feedback_text.h'
          edit(h,'lower.find("feature") != std::string::npos || lower.find("colordiag") != std::string::npos;',
              '''lower.find("feature") != std::string::npos || lower.find("colordiag") != std::string::npos ||
                      lower.find("another reshade instance") != std::string::npos ||
                      lower.find("device_removed") != std::string::npos || lower.find("device_hung") != std::string::npos ||
                      lower.find("device removed") != std::string::npos || lower.find("device hung") != std::string::npos;''')
          edit(h,'        else if (lower.find("fail") != std::string::npos || lower.find("error") != std::string::npos) key = "first-error";',
              '''        else if (lower.find("another reshade instance") != std::string::npos) key = "first-duplicate-reshade";
                  else if (lower.find("device_removed") != std::string::npos || lower.find("device_hung") != std::string::npos ||
                           lower.find("device removed") != std::string::npos || lower.find("device hung") != std::string::npos) key = "first-device-failure";
                  else if (lower.find("fail") != std::string::npos || lower.find("error") != std::string::npos) key = "first-error";''')
          t='scripts/validate-core-feedback.py'
          edit(t,'check(!g_feedback_last_zip[0],"new request clears old path");',
              'check(!g_feedback_last_zip[0],"new request clears old path");check(!nr_core_feedback::g_submission[0],"new request clears old ticket");')
          edit(t,'    save("valid-core.zip");',
              '''    check(std::strstr(nr_core_feedback::g_submission,first.session)!=nullptr,"ticket bound to completed core session");
              check(std::strstr(nr_core_feedback::g_submission,"Private Tester")==nullptr,"ticket excludes local path");
              save("valid-core.zip");''')
          edit(t,'"queue failure releases publication with no stale ZIP");',
              '"queue failure releases publication with no stale ZIP");\n    check(!nr_core_feedback::g_submission[0],"failed queue exposes no previous ticket");')
          ci='.github/workflows/beta042-validate.yml'
          edit(ci,'          python3 scripts/validate-bug-sweep.py --compiler g++',
              '          python3 scripts/validate-bug-sweep.py --compiler g++\n          python3 scripts/validate-043r2.py --compiler g++\n          python3 -m unittest discover -s tests -p test_feedback_report.py -v')
          anchor='      - name: LLVM static analysis'
          edit(ci,anchor,'''      - name: R2 native post-SR snapshot and integration regressions
                  shell: pwsh
                  run: |
                    $compiler = Join-Path $env:TOOLCHAIN_ROOT 'bin/x86_64-w64-mingw32-clang++.exe'
                    python scripts/validate-043r2.py --compiler $compiler
                    if ($LASTEXITCODE -ne 0) { throw 'R2 integration regression failed' }
                    & $compiler -std=c++20 -O0 -Wall -Wextra -Werror -static -Isrc tests/post_sr_snapshot_gpu.cpp -o post-snapshot.exe -ld3d12 -ldxgi -ldxguid
                    if ($LASTEXITCODE -ne 0) { throw 'Post-SR WARP harness compilation failed' }
                    ./post-snapshot.exe
                    if ($LASTEXITCODE -ne 0) { throw 'Post-SR WARP oracle failed' }
                    $negative = & ./post-snapshot.exe --negative-control 2>&1
                    if ($LASTEXITCODE -ne 1 -or ($negative -join "`n") -notmatch 'native/snapshot FP16 bytes') { throw 'Post-SR negative control did not reject the exact wrong pixel' }
          '''+anchor)
          for p,text in texts.items():Path(p).write_text(text,encoding='utf-8',newline='\n')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['python3','scripts/validate-043r2.py','--compiler','g++'],check=True)
          subprocess.run(['python3','scripts/validate-bug-sweep.py','--compiler','g++'],check=True)
          subprocess.run(['python3','-m','unittest','discover','-s','tests','-p','test*feedback*.py','-v'],check=True)
          subprocess.run(['python3','tests/test_f8_parser.py'],check=True)
          # Print the production completion routine for final reset-state review.
          s=texts[cpp];p=s.index('void CompleteNrDiagnosticEvaluation(');b=s.index('{',p);depth=0
          for e in range(b,len(s)):
              if s[e]=='{':depth+=1
              elif s[e]=='}':
                  depth-=1
                  if not depth:break
          print('REVIEW COMPLETION\n'+s[p:e+1])
          for p,text in texts.items():
              request=urllib.request.Request('https://api.github.com/repos/smartLanny/dlss5-nr-before-sr-lab/git/blobs',
                  data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:sha=json.load(response)['sha']
              assert sha==blob(text.encode('utf-8'))
              print('REVIEW_BLOB '+json.dumps({'path':p,'mode':'100644','type':'blob','sha':sha}),flush=True)
