name: Stage Manager homepage integration
on:
  push:
    branches: [codex/manager-official-link-ux]
    paths: [.github/workflows/stage-manager-links.yml]
permissions:
  contents: write
jobs:
  source-blobs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact-source integration and run contracts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          assert os.environ['GITHUB_REPOSITORY']=='smartLanny/dlss5-nr-before-sr-lab'
          assert os.environ['GITHUB_REF']=='refs/heads/codex/manager-official-link-ux'
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          expected={'main.js':'13979bb325eed407217e7079ed82a8d074c6080e','src/product/constants.js':'737d9e04a9eb549026ac5e198b8ff49e7d58d997','src/renderer/renderer.js':'bb7a249a695f25cd23520d161f4400313e982aad','preview/renderer.js':'bb7a249a695f25cd23520d161f4400313e982aad'}
          texts={}
          for path,sha in expected.items():
              data=Path(path).read_bytes();assert blob(data)==sha,path
              texts[path]=data.decode('utf-8')
          def edit(path,old,new):
              assert texts[path].count(old)==1,(path,old)
              texts[path]=texts[path].replace(old,new)
          edit('main.js',"const {createAppService}=require('./src/product/app-service');","const {createAppService}=require('./src/product/app-service');\nconst {openConfiguredLink}=require('./src/product/external-links');")
          edit('main.js'," call('open-external',async key=>{if(!['bilibiliUrl','releaseUrl'].includes(key))return false;const url=service.product[key];if(typeof url!=='string'||!url.startsWith('https://'))return false;await shell.openExternal(url);return true;});", " call('open-external',key=>openConfiguredLink(service.product,key,url=>shell.openExternal(url)));")
          edit('src/product/constants.js',"const branding = require('../../product.json');","const branding = require('../../product.json');\nconst { configuredHttpsLink } = require('./external-links');")
          edit('src/product/constants.js','  ...branding,','  ...branding,\n  bilibiliUrl: configuredHttpsLink(branding, \'bilibiliUrl\'),\n  releaseUrl: configuredHttpsLink(branding, \'releaseUrl\'),')
          controller='''// Product links are normalized by the main process. This action has its
          // own busy state and never takes the scan/install/repair operation lock.
          function configureHomepage(product) {
            const button=$('bilibili');
            const configured=typeof product?.bilibiliUrl==='string' && product.bilibiliUrl.startsWith('https://');
            let opening=false;
            button.hidden=!configured;
            button.classList.toggle('hidden',!configured);
            button.disabled=!configured;
            button.textContent='Bilibili 主页 ↗';
            button.title='在默认浏览器打开官方主页';
            button.setAttribute('aria-label','在默认浏览器打开 Bilibili 官方主页');
            button.onclick=async()=>{
              if(!configured || opening)return;
              opening=true;button.disabled=true;
              try {
                if(!unwrap(await api.openExternal('bilibiliUrl')))
                  note('暂时无法打开主页，请检查默认浏览器后重试。',true);
              } catch {
                note('暂时无法打开主页，请检查默认浏览器后重试。',true);
              } finally {
                opening=false;button.disabled=!configured;
              }
            };
          }
          '''
          for path in ['src/renderer/renderer.js','preview/renderer.js']:
              edit(path,'async function boot(){',controller+'async function boot(){')
              edit(path,"$('group').classList.toggle('hidden',!d.product.qqGroup);showPayload();render();}","$('group').classList.toggle('hidden',!d.product.qqGroup);configureHomepage(d.product);showPayload();render();}")
              edit(path,"$('bilibili').onclick=()=>run(()=>api.openExternal('bilibiliUrl'));",'')
          for path,text in texts.items():Path(path).write_text(text,encoding='utf-8',newline='\n')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['npm','test'],check=True)
          for path,text in texts.items():
              data=text.encode('utf-8')
              request=urllib.request.Request('https://api.github.com/repos/smartLanny/dlss5-nr-before-sr-lab/git/blobs',data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: sha=json.load(response)['sha']
              assert sha==blob(data)
              print('REVIEW_BLOB '+json.dumps({'path':path,'mode':'100644','type':'blob','sha':sha}),flush=True)
          PY
