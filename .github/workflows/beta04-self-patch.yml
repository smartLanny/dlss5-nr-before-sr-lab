name: Finalize beta0.4 perfect-chain r2

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-r2-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'one-shot beta0.4 r2') || contains(github.event.head_commit.message, 'Run beta0.4 r2 finalizer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/beta0.4-perfect-chain
          fetch-depth: 0
      - name: Apply r2 audit and remove temporary scaffolding
        run: python scripts/apply-beta04-r2-audit.py
      - name: Normalize the multiline R8 invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-beta04-structure.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'if "modelValueDomain ? saturate(proxyValue)" not in body:\n'
              '    raise SystemExit("bounded R8 value-domain preservation missing")\n',
              'if ("float3 storedProxy = modelValueDomain" not in body or\n'
              '        "? saturate(proxyValue)" not in body):\n'
              '    raise SystemExit("bounded R8 value-domain preservation missing")\n')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Validate finalized source
        run: |
          python scripts/validate-beta04-structure.py
          python scripts/test-beta04-math.py
          git diff --check
      - name: Commit finalized branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize beta0.4 perfect-chain r2"
          git push origin HEAD:codex/beta0.4-perfect-chain
