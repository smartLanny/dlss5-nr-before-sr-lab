name: Integrate compatibility regressions
on:
  push:
    branches: [codex/compat-fg-ui-sweep]
    paths: ['.github/workflows/compat-stage-tests.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/compat-fg-ui-sweep
          fetch-depth: 0
      - name: Apply ordinary test edits and execute portable regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/compat-stage-tests.py
          python3 scripts/validate-compat-sweep.py --compiler g++
          python3 scripts/validate-beta04-structure.py
          python3 scripts/validate-beta04-result-resize.py
          python3 -m unittest discover -s tests -p test_feedback_report.py -v
          git diff --check
          git add scripts/feedback-report.py scripts/validate-beta04-structure.py scripts/validate-command-state-native.ps1 scripts/validate-core-feedback.py scripts/validate-null-pso-policy.py tests/command_state_native_harness.cpp.in tests/test_feedback_report.py
          git rm scripts/compat-stage-*.txt scripts/compat-stage-runtime.py scripts/compat-stage-tests.py
          git config user.name smartLanny
          git config user.email 51014844+smartLanny@users.noreply.github.com
          git commit -m 'test: exercise native pristine-null GPU restore, live feedback evidence and report privacy'
          git push origin HEAD:codex/compat-fg-ui-sweep
