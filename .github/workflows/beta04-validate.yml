name: Validate beta0.4 perfect-chain

on:
  workflow_dispatch:
  push:
    branches:
      - codex/beta0.4-perfect-chain

permissions:
  contents: write

concurrency:
  group: beta04-validate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  shader-and-structure:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[beta04-ci-report]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply idempotent compiler hotfixes
        run: python scripts/fix-beta04-hlsl.py
      - name: Structural invariants
        run: python scripts/validate-beta04-structure.py
      - name: Compile every embedded shader entry and retain report
        id: shaders
        continue-on-error: true
        shell: pwsh
        run: |
          $report = 'docs/BETA_0_4_SHADER_REPORT.txt'
          Remove-Item $report -ErrorAction SilentlyContinue
          $status = 0
          try {
            & ./scripts/validate-codec-shader.ps1 *>&1 | Tee-Object -FilePath $report
            if (-not $?) { $status = 1 }
            if ($LASTEXITCODE) { $status = $LASTEXITCODE }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $report -Append
            $status = 1
          }
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $status
      - name: Commit shader report
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path docs/BETA_0_4_SHADER_REPORT.txt)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BETA_0_4_SHADER_REPORT.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Record beta0.4 shader validation [beta04-ci-report]'
          git pull --rebase origin codex/beta0.4-perfect-chain
          git push origin HEAD:codex/beta0.4-perfect-chain
      - name: Enforce shader result
        if: steps.shaders.outputs.exit_code != '0'
        run: exit 1

  full-build:
    needs: shader-and-structure
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply idempotent compiler hotfixes
        run: python scripts/fix-beta04-hlsl.py
      - name: Fetch public build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'beta04-validator' }
          $release = Invoke-RestMethod -Headers $headers `
            'https://api.github.com/repos/mstorsjo/llvm-mingw/releases/latest'
          $asset = $release.assets | Where-Object {
            $_.name -match '^llvm-mingw-.*-ucrt-x86_64\.zip$'
          } | Select-Object -First 1
          if (-not $asset) { throw 'No llvm-mingw UCRT x86_64 archive found.' }
          Invoke-WebRequest $asset.browser_download_url -OutFile llvm-mingw.zip
          Expand-Archive llvm-mingw.zip -DestinationPath toolchain
          $toolchain = (Get-ChildItem toolchain -Directory | Select-Object -First 1).FullName
          git clone --depth 1 --recurse-submodules --shallow-submodules `
            https://github.com/crosire/reshade.git reshade-source
          "TOOLCHAIN_ROOT=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RESHADE_ROOT=$pwd\reshade-source" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build English and Chinese add-ons and retain report
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $report = 'docs/BETA_0_4_BUILD_REPORT.txt'
          Remove-Item $report -ErrorAction SilentlyContinue
          $status = 0
          try {
            & ./scripts/build.ps1 -Clean -ToolchainRoot $env:TOOLCHAIN_ROOT `
              -ReShadeSourceRoot $env:RESHADE_ROOT *>&1 | Tee-Object -FilePath $report
            if (-not $?) { $status = 1 }
            if ($LASTEXITCODE) { $status = $LASTEXITCODE }
          } catch {
            $_ | Out-String | Tee-Object -FilePath $report -Append
            $status = 1
          }
          "exit_code=$status" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $status
      - name: Append hashes to report
        if: steps.build.outputs.exit_code == '0'
        shell: pwsh
        run: |
          Get-FileHash build/* -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String |
            Tee-Object -FilePath docs/BETA_0_4_BUILD_REPORT.txt -Append
      - name: Commit build report
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path docs/BETA_0_4_BUILD_REPORT.txt)) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BETA_0_4_BUILD_REPORT.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Record beta0.4 full-build validation [beta04-ci-report]'
          git pull --rebase origin codex/beta0.4-perfect-chain
          git push origin HEAD:codex/beta0.4-perfect-chain
      - name: Enforce build result
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: beta04-perfect-chain-build
          path: build/
          if-no-files-found: error
